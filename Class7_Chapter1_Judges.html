/* ---------- HELPERS ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const bi = (en, ml, tag="span") => `<${tag} class="en">${esc(en)}</${tag}>${ml ? `<${tag} class="ml">${esc(ml)}</${tag}>` : ""}`;
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};

/* ---------- LANGUAGE ---------- */
function setLang(l){
  document.body.dataset.lang = l;
  document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === l));
  store.set("c7lang", l);
}
document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));

const C = CH[0], N = C.mcq.length;

/* ---------- TABS ---------- */
const TABS = [{id:"practice", label:"Practice", sub:"പരിശീലനം"}, {id:"test", label:"Chapter Test", sub:`${N} questions · പാഠ പരീക്ഷ`}];
function renderTabs(active){
  $("#tabs").innerHTML = TABS.map(t => `<a class="tab" role="tab" href="#${t.id}" aria-selected="${t.id === active}" data-id="${t.id}">${esc(t.label)}<small class="ml-small">${esc(t.sub)}</small></a>`).join("");
}

/* ---------- MCQ ---------- */
function mcqHTML(q, idx, key){
  const order = shuffle([0,1,2,3]);
  return `<li class="q" data-key="${key}" data-correct="${q[3]}">
    <span class="n">${idx}.</span>
    <div class="body">
      <div class="qtext">${bi(q[0], q[1])}</div>
      <div class="opts">${order.map(i => `<button type="button" class="opt" data-i="${i}">${bi(q[2][i][0], q[2][i][1])}</button>`).join("")}</div>
      <div class="fb" hidden></div>
    </div>
  </li>`;
}
function answerMCQ(li, btn, q, onDone){
  const correct = +li.dataset.correct, pick = +btn.dataset.i, ok = pick === correct;
  li.querySelectorAll(".opt").forEach(b => {
    b.disabled = true;
    const i = +b.dataset.i;
    if (i === correct) b.classList.add("correct");
    else if (i === pick) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  const fb = li.querySelector(".fb");
  const right = q[2][correct];
  fb.innerHTML = ok
    ? `<b class="ok">${bi("Correct!", "ശരിയാണ്!")}</b> ${q[4] ? bi(q[4], q[5]) : ""}`
    : `<b class="bad">${bi("Not quite.", "തെറ്റി.")}</b> ${bi("Answer: " + right[0], "ഉത്തരം: " + right[1])} ${q[4] ? bi(q[4], q[5]) : ""}`;
  fb.hidden = false;
  onDone && onDone(ok, pick);
}

  $("#start").addEventListener("click", startTest);
}
function startTest(){
  const qs = shuffle(C.mcq);
  let i = 0, score = 0; const missed = [];

    if (i >= qs.length) return finish();
    const q = qs[i];
    $("#view").innerHTML = `
      <div style="display:flex;flex-direction:column;gap:8px">
        <div class="test-meta"><span>${bi("Question " + (i + 1) + " of " + N, " · ചോദ്യം " + (i + 1) + "/" + N)}</span><span>${bi("Score " + score, " · മാർക്ക് " + score)}</span></div>
        <div class="bar"><i style="width:${i / qs.length * 100}%"></i></div>
      </div>
      <ol class="qlist"><li class="q" data-correct="${q[3]}"><span class="n">${i + 1}.</span>
        <div class="body">
          <div class="qtext">${bi(q[0], q[1])}</div>
          <div class="opts">${shuffle([0,1,2,3]).map(k => `<button type="button" class="opt" data-i="${k}">${bi(q[2][k][0], q[2][k][1])}</button>`).join("")}</div>
          <div class="fb" hidden></div>
        </div></li></ol>
      <div class="btnrow"><button type="button" class="btn" id="next" hidden>${i === qs.length - 1 ? bi("See my score", " · മാർക്ക് കാണുക") : bi("Next question", " · അടുത്ത ചോദ്യം")}</button></div>`;
    const li = $("#view .q");
    li.querySelectorAll(".opt").forEach(btn => btn.addEventListener("click", () => {
      answerMCQ(li, btn, q, ok => { if (ok) score++; else missed.push(q); $("#next").hidden = false; $("#next").focus(); });
    }));
    $("#next").addEventListener("click", () => { i++; step(); window.scrollTo({top:0}); });
  };
  const finish = () => {
    const best = store.get(BEST, 0);
    if (score > best) store.set(BEST, score);
    const pct = score / N;
    const msg = pct >= .9 ? ["Excellent! Well prepared.", "മികച്ചത്! നന്നായി പഠിച്ചിട്ടുണ്ട്."]
              : pct >= .7 ? ["Good work. Revise the ones you missed.", "നല്ലത്. തെറ്റിയവ ഒന്നുകൂടി പഠിക്കുക."]
              : ["Keep practising. Go through the chapter again.", "പാഠം ഒന്നുകൂടി വായിച്ച് പരിശീലിക്കുക."];
    $("#view").innerHTML = `
      <div class="result">
        <span class="chip">${bi("Your score", " · നിങ്ങളുടെ മാർക്ക്")}</span>
        <div class="big">${score}<small>/${N}</small></div>
        <p style="margin:0">${bi(msg[0], msg[1])}</p>
        <div class="btnrow" style="justify-content:center;margin-top:8px">
          <button type="button" class="btn" id="again">${bi("Try again", " · വീണ്ടും എഴുതുക")}</button>
        </div>
      </div>
      ${missed.length ? `<section style="display:flex;flex-direction:column;gap:12px">
        <div class="sec-title"><h3><span class="en">Questions to revise</span><span class="ml">വീണ്ടും പഠിക്കേണ്ടവ</span></h3></div>
        <div class="cards">${missed.map(q => `<div class="card">
          <div class="qtext">${bi(q[0], q[1])}</div>
          <div class="ans">${bi("Answer: " + q[2][q[3]][0], "ഉത്തരം: " + q[2][q[3]][1], "div")}</div>
        </div>`).join("")}</div></section>` : ""}`;
    $("#again").addEventListener("click", startTest);
  };
  step();
}

/* ---------- ROUTING ---------- */
function show(id){
  renderTabs(id);
  if (id === "test") renderTestIntro(); else renderChapter(C);
}
function route(){ show(location.hash === "#test" ? "test" : "practice"); }
document.addEventListener("click", e => {
  const t = e.target.closest(".tab");
  if (!t) return;
  e.preventDefault();
  try { history.replaceState(null, "", "#" + t.dataset.id); } catch(err) {}
  show(t.dataset.id);
  window.scrollTo({top:0});
});
window.addEventListener("hashchange", route);
setLang(store.get("c7lang", "both"));
route();
</script>
