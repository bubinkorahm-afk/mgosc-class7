<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Class 7 Revision 9–13</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@600;800&family=Alegreya+Sans:wght@400;500;700&family=Noto+Sans+Malayalam:wght@400;600;700&display=swap">
<style>
/* Layout: one reading column; sticky chapter bar; questions as numbered practice items, then reveal-answer cards */
:root{
  --bg:#F5F3F7; --surface:#FFFFFF; --sunk:#ECE8F0; --ink:#1E1A29; --muted:#625B70; --line:#DCD6E3;
  --accent:#8A1C3B; --accent-ink:#FFFFFF; --accent-soft:#F6E4EA; --gold:#9A6E1C; --gold-soft:#F7EEDB;
  --ok:#1D7A4A; --ok-soft:#E1F3E8; --bad:#B4322C; --bad-soft:#FBE6E4;
  --f-display:"Alegreya", Georgia, serif;
  --f-body:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --f-ml:"Noto Sans Malayalam", "Manjari", "Kartika", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15111B; --surface:#201A28; --sunk:#2A2333; --ink:#EEE9F3; --muted:#A79FB4; --line:#3A3245;
  --accent:#E8789A; --accent-ink:#1A0D13; --accent-soft:#3A1C28; --gold:#E2B65A; --gold-soft:#352A16;
  --ok:#5BCB8C; --ok-soft:#173226; --bad:#F08079; --bad-soft:#3A1C1B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15111B; --surface:#201A28; --sunk:#2A2333; --ink:#EEE9F3; --muted:#A79FB4; --line:#3A3245;
  --accent:#E8789A; --accent-ink:#1A0D13; --accent-soft:#3A1C28; --gold:#E2B65A; --gold-soft:#352A16;
  --ok:#5BCB8C; --ok-soft:#173226; --bad:#F08079; --bad-soft:#3A1C1B; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.ml{font-family:var(--f-ml);line-height:1.7}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{padding-block:22px 16px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between}
.brand .eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);font-weight:700}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,5vw,34px);line-height:1.1;margin:4px 0 2px;text-wrap:balance}
.brand p{margin:0;color:var(--muted);font-size:15px}

.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);font:600 14px var(--f-body);padding:7px 13px;border-radius:999px;cursor:pointer}
.seg button.ml{font-family:var(--f-ml);font-size:13px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:6px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
nav.tabs .wrap::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:8px 14px;font:600 15px var(--f-body);cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:0;text-decoration:none}
.tab small{font-weight:500;color:var(--muted);font-size:12px}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tab[aria-selected="true"] small{color:var(--accent-ink);opacity:.85}

main .wrap{padding-block:26px 64px;display:flex;flex-direction:column;gap:28px}
.chap-head .num{font:700 13px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.chap-head h2{font-family:var(--f-display);font-size:clamp(24px,4.5vw,30px);line-height:1.15;margin:4px 0 0;text-wrap:balance}
.chap-head h2 .ml{display:block;font-size:.78em;font-weight:700;margin-top:4px;color:var(--muted)}

.verse{background:var(--gold-soft);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.verse .lbl{font-size:12px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--gold)}
.verse q{quotes:none;font-family:var(--f-display);font-size:19px;font-weight:600;line-height:1.4}
.verse .ml{font-size:16px}
.verse cite{font-style:normal;color:var(--muted);font-size:14px}

.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:6px}
.sec-title h3{margin:0;font-family:var(--f-display);font-size:21px}
.sec-title h3 .ml{font-size:15px;font-weight:600;color:var(--muted);margin-left:6px}
.score{font-variant-numeric:tabular-nums;font-size:15px;color:var(--muted)}
.score b{color:var(--ink)}

.qlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.q .n{font:700 15px var(--f-body);color:var(--accent);font-variant-numeric:tabular-nums;padding-top:1px;min-width:1.6em}
.q .body{min-width:0;display:flex;flex-direction:column;gap:10px}
.qtext{font-weight:700;font-size:17px}
.qtext .ml{display:block;font-weight:600;font-size:15.5px;color:var(--ink)}
.qtext .en + .ml{margin-top:2px;color:var(--muted)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:560px){.opts{grid-template-columns:1fr}}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:9px 12px;cursor:pointer;font:500 16px var(--f-body);display:flex;flex-direction:column;gap:1px;min-width:0}
.opt .ml{font-size:14.5px;color:var(--muted)}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:focus-visible,.tab:focus-visible,.seg button:focus-visible,.btn:focus-visible,.reveal:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .ml{color:var(--ink)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .ml{color:var(--ink)}
.opt.dim{opacity:.55}
.fb{font-size:15px;border-radius:10px;padding:9px 12px;background:var(--sunk)}
.fb b.ok{color:var(--ok)} .fb b.bad{color:var(--bad)}
.fb .ml{display:block;font-size:14px}

.cards{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.reveal{align-self:flex-start;border:1.5px solid var(--accent);color:var(--accent);background:transparent;border-radius:999px;padding:6px 14px;font:700 14px var(--f-body);cursor:pointer}
.reveal .ml{font-weight:600;font-size:13px}
.ans{background:var(--accent-soft);border-radius:10px;padding:12px 14px;font-size:16px}
.ans ol,.ans ul{margin:0;padding-left:1.3em}
.ans .ml{margin-top:8px;font-size:15px}
.ans .ml:first-child{margin-top:0}

.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:11px 18px;font:700 16px var(--f-body);cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}

/* Test mode */
.test-intro{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:14px}
.test-intro p{margin:0}
.bar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.test-meta{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.result{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.result .big{font-family:var(--f-display);font-size:56px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.result .big small{font-size:24px;color:var(--muted)}
.chip{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--muted)}

body[data-lang="en"] .ml{display:none!important}
body[data-lang="ml"] .en{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
footer{color:var(--muted);font-size:13px;text-align:center;padding-block:0 32px}
html{color-scheme:light}body{margin:0}[hidden]{display:none!important}img{max-width:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>

  ["How did Peter feel when Jesus asked the question the third time?","മൂന്നാം പ്രാവശ്യം ചോദിച്ചപ്പോൾ പത്രോസിന്റെ അവസ്ഥ?",
   [["Grieved and in tears","ദുഃഖിതനായി, കണ്ണീരോടെ"],["Angry","കോപിച്ചു"],["Very happy","വളരെ സന്തോഷിച്ചു"],["He ran away","ഓടിപ്പോയി"]],0,
   "He said, “Lord, You know all things; You know that I love You.”","“കർത്താവേ നീ സകലവും അറിയുന്നു; എനിക്ക് നിന്നോട് പ്രിയമുണ്ട് എന്നും നീ അറിയുന്നു” എന്ന് പറഞ്ഞു."],
  ["What does this lesson show is “the measure” in our relationship with Jesus?","യേശുവുമായുള്ള ബന്ധത്തിന്റെ അളവുകോൽ എന്ത് എന്ന് ഈ പാഠം കാണിക്കുന്നു?",
   [["Love","സ്നേഹം"],["Wealth","ധനം"],["Knowledge","അറിവ്"],["Strength","ശക്തി"]],0,"",""],
  ["The memory verse of this chapter is from…","ഈ പാഠത്തിലെ മനഃപാഠവാക്യം ഏത് ഭാഗത്തുനിന്ന്?",
   [["St. Matthew 7:21","മത്തായി 7:21"],["St. Matthew 16:22","മത്തായി 16:22"],["St. John 21:15","യോഹ. 21:15"],["St. Matthew 26:75","മത്തായി 26:75"]],0,"",""]
 ],
 short:[
  {en:"Describe the miraculous catch of fish at Lake Tiberias.", ml:"തിബെര്യാസ് കടലിലെ അത്ഭുതകരമായ മീൻപിടുത്തം വിവരിക്കുക.",
   aen:["After denying Jesus, Peter went back to fishing with other disciples. They worked all night but caught nothing. At dawn Jesus stood on the shore and told them to cast the net on the right side of the boat. The net was so full they could not draw it in. John recognised Jesus first. There were 153 big fish and the net did not break. Jesus had breakfast ready for them (St. John 21:1-13)."],
   aml:["യേശുവിനെ തള്ളിപ്പറഞ്ഞശേഷം പത്രോസ് മറ്റ് ശിഷ്യന്മാരോടൊപ്പം മീൻപിടുത്തത്തിലേക്ക് മടങ്ങി. രാത്രി മുഴുവൻ അദ്ധ്വാനിച്ചിട്ടും ഒന്നും കിട്ടിയില്ല. പുലർച്ചെ കരയിൽ നിന്ന യേശു പടകിന്റെ വലതുഭാഗത്ത് വല വീശാൻ പറഞ്ഞു. വല വലിച്ചുകയറ്റാൻ കഴിയാത്തവിധം മീൻ നിറഞ്ഞു. യോഹന്നാൻ ആദ്യം യേശുവിനെ തിരിച്ചറിഞ്ഞു. 153 വലിയ മത്സ്യങ്ങൾ ഉണ്ടായിരുന്നു; വല കീറിയില്ല. യേശു അവർക്ക് പ്രാതൽ ഒരുക്കിയിരുന്നു (യോഹ. 21:1-13)."]},
  {en:"Why did Jesus ask Peter the same question three times? What were His three commands?", ml:"യേശു ഒരേ ചോദ്യം മൂന്നു പ്രാവശ്യം ചോദിച്ചത് എന്തിന്? മൂന്ന് കല്പനകൾ ഏവ?",
   aen:["Peter had denied Jesus three times, so Jesus let him declare his love three times. In this way Jesus reinstated Peter, took him back among the apostles and gave him his work again.","Commands: 1) Feed My lambs  2) Tend My sheep  3) Feed My sheep."],
   aml:["പത്രോസ് മൂന്നു പ്രാവശ്യം തള്ളിപ്പറഞ്ഞതിനാൽ മൂന്നു പ്രാവശ്യം സ്നേഹം ഏറ്റുപറയാൻ യേശു അവസരം നൽകി. അങ്ങനെ പത്രോസിനെ തിരികെ സ്വീകരിച്ച് അപ്പോസ്തോലസമൂഹത്തിൽ ചേർത്ത് നിയോഗം തിരികെ നൽകി.","കല്പനകൾ: 1) എന്റെ കുഞ്ഞാടുകളെ മേയ്ക്കുക  2) എന്റെ ആടുകളെ പാലിക്കുക  3) എന്റെ ആടുകളെ മേയ്ക്കുക."]},
  {en:"What does this lesson teach us about God’s love?", ml:"ദൈവസ്നേഹത്തെക്കുറിച്ച് ഈ പാഠം നമ്മെ പഠിപ്പിക്കുന്നത് എന്ത്?",
   aen:["God’s love does not reject us even when we deny Him.","God brings us back even if we drift into sin.","God wants us to repent and return to Him.","God knows our needs completely and provides even without our asking."],
   aml:["നാം തള്ളിപ്പറഞ്ഞാലും ദൈവസ്നേഹം നമ്മെ തള്ളിക്കളയുന്നില്ല.","പാപത്തിലേക്ക് നീങ്ങിയാലും ദൈവം നമ്മെ തിരികെ കൊണ്ടുവരും.","നാം പശ്ചാത്തപിച്ച് മടങ്ങിവരണമെന്ന് ദൈവം ആഗ്രഹിക്കുന്നു.","നമ്മുടെ ആവശ്യങ്ങൾ ദൈവം പൂർണ്ണമായി അറിയുന്നു; ചോദിക്കാതെ തന്നെ നൽകുന്നു."]},
  {en:"Resolution of this chapter", ml:"ഈ പാഠത്തിലെ നിശ്ചയം",
   aen:["We would never reject the love of God. We would be faithful in the responsibilities God has given us. If we go wrong we would repent and beg forgiveness from God."],
   aml:["ദൈവം എന്നിൽ ഏൽപ്പിച്ചിരിക്കുന്ന ഉത്തരവാദിത്വങ്ങൾ പാലിക്കും. ജീവിതത്തിൽ തെറ്റുകൾ ഉണ്ടായാൽ അനുതാപത്തോടെ ദൈവസന്നിധിയിൽ വന്ന് ക്ഷമ യാചിക്കും."]}
 ]
},
{
 id:"ch10", n:10, en:"Ascension of Jesus", ml:"സ്വർഗ്ഗാരോഹണം",
 verse:{en:"“Men of Galilee, why do you stand gazing up into heaven? This same Jesus, who was taken up from you into heaven, will come in like manner as you saw Him go into heaven.”", ml:"“ഗലീലപുരുഷന്മാരേ, നിങ്ങൾ ആകാശത്തിലേക്ക് നോക്കി നിൽക്കുന്നത് എന്ത്? നിങ്ങളെ വിട്ട് സ്വർഗ്ഗാരോഹണം ചെയ്ത ഈ യേശുവിനെ സ്വർഗ്ഗത്തിലേക്ക് പോകുന്നവനായി നിങ്ങൾ കണ്ടതുപോലെതന്നെ അവൻ വീണ്ടും വരും എന്നു പറഞ്ഞു”", ref:"Acts 1:11 · അ. പ്ര. 1:11"},
 mcq:[
  ["For how many days did the risen Christ stay with the disciples before the Ascension?","സ്വർഗ്ഗാരോഹണത്തിനു മുമ്പ് ഉയിർത്തെഴുന്നേറ്റ ക്രിസ്തു എത്ര ദിവസം ശിഷ്യന്മാരോടൊപ്പം ഉണ്ടായിരുന്നു?",
   [["40 days","40 ദിവസം"],["50 days","50 ദിവസം"],["3 days","3 ദിവസം"],["7 days","7 ദിവസം"]],0,"",""],
  ["Where did Jesus gather His disciples before the Ascension?","സ്വർഗ്ഗാരോഹണത്തിനു മുമ്പ് യേശു ശിഷ്യന്മാരെ ഒരുമിച്ചുകൂട്ടിയത് എവിടെ?",
   [["Mount of Olives (Olivet)","ഒലിവുമല"],["Mount Sinai","സീനായ് മല"],["Mount Tabor","താബോർ മല"],["Mount Carmel","കർമ്മേൽ മല"]],0,"",""],
  ["How far is the Mount of Olives from Jerusalem?","യെരുശലേമും ഒലിവുമലയും തമ്മിലുള്ള ദൂരം?",
   [["A Sabbath day’s journey","ഒരു ശബത്ത് ദിവസത്തെ വഴിദൂരം"],["Seven miles","ഏഴ് നാഴിക"],["Forty miles","നാല്പത് നാഴിക"],["Three days’ journey","മൂന്നു ദിവസത്തെ യാത്ര"]],0,
   "Acts 1:12. The English textbook says “a day’s journey”.","അ. പ്ര. 1:12."],
  ["Jesus told the disciples not to leave Jerusalem but to wait for…","യെരുശലേം വിട്ടുപോകാതെ എന്തിനായി കാത്തിരിക്കാനാണ് യേശു പറഞ്ഞത്?",
   [["The Promise of the Father","പിതാവിന്റെ വാഗ്ദാനത്തിനായി"],["A new king","ഒരു പുതിയ രാജാവിനായി"],["The Roman governor","റോമൻ ഗവർണ്ണർക്കായി"],["The end of the world","ലോകാവസാനത്തിനായി"]],0,"",""],
  ["What kind of baptism did the Father promise?","പിതാവ് വാഗ്ദാനം ചെയ്തത് എന്തുകൊണ്ടുള്ള സ്നാനം?",
   [["Baptism with the Holy Spirit","പരിശുദ്ധാത്മാവുകൊണ്ടുള്ള സ്നാനം"],["Baptism with water only","വെള്ളംകൊണ്ട് മാത്രമുള്ള സ്നാനം"],["Baptism with oil","തൈലംകൊണ്ടുള്ള സ്നാനം"],["Baptism with fire only","തീകൊണ്ട് മാത്രമുള്ള സ്നാനം"]],0,"",""],
  ["After receiving the Holy Spirit, where were the disciples to be Christ’s witnesses?","പരിശുദ്ധാത്മശക്തി ലഭിച്ചശേഷം ശിഷ്യന്മാർ എവിടെയെല്ലാം സാക്ഷികളാകണം?",
   [["In Jerusalem, Judea, Samaria and to the end of the earth","യെരുശലേമിലും യെഹൂദ്യയിലും ശമര്യയിലും ഭൂമിയുടെ അറ്റത്തോളവും"],["Only in Jerusalem","യെരുശലേമിൽ മാത്രം"],["Only in Galilee","ഗലീലയിൽ മാത്രം"],["Only in Rome","റോമായിൽ മാത്രം"]],0,
   "Acts 1:8.","അ. പ്ര. 1:8."],
  ["What hid Jesus from the disciples’ sight as He ascended?","സ്വർഗ്ഗാരോഹണം ചെയ്ത യേശുവിനെ ശിഷ്യന്മാരുടെ കാഴ്ചയിൽനിന്ന് മറച്ചത്?",
   [["A cloud","ഒരു മേഘം"],["A fire","തീ"],["Darkness","ഇരുട്ട്"],["A storm","കൊടുങ്കാറ്റ്"]],0,"",""],
  ["Who appeared to the disciples as they looked up to heaven?","ശിഷ്യന്മാർ ആകാശത്തേക്ക് നോക്കിനിൽക്കുമ്പോൾ പ്രത്യക്ഷരായത് ആര്?",
   [["Two men (angels) in white","വെള്ളവസ്ത്രം ധരിച്ച രണ്ട് പുരുഷന്മാർ (ദൂതന്മാർ)"],["Moses and Elijah","മോശയും ഏലിയാവും"],["St. Mary","വി. മറിയം"],["Roman soldiers","റോമൻ പടയാളികൾ"]],0,"",""],
  ["How did the angels address the disciples?","ദൂതന്മാർ ശിഷ്യന്മാരെ അഭിസംബോധന ചെയ്തത് എങ്ങനെ?",
   [["“Men of Galilee”","“ഗലീലപുരുഷന്മാരേ”"],["“Children of Israel”","“യിസ്രായേൽ മക്കളേ”"],["“Fishermen”","“മീൻപിടുത്തക്കാരേ”"],["“Brothers”","“സഹോദരന്മാരേ”"]],0,"",""],
  ["What did the angels promise?","ദൂതന്മാർ നൽകിയ വാഗ്ദാനം?",
   [["Jesus will come again in the same way","യേശു അതുപോലെതന്നെ വീണ്ടും വരും"],["The disciples will become kings","ശിഷ്യന്മാർ രാജാക്കന്മാരാകും"],["Jerusalem will be destroyed","യെരുശലേം നശിപ്പിക്കപ്പെടും"],["They will never suffer","അവർ ഒരിക്കലും കഷ്ടപ്പെടുകയില്ല"]],0,"",""],
  ["How did the disciples return to Jerusalem?","ശിഷ്യന്മാർ യെരുശലേമിലേക്ക് മടങ്ങിയത് എങ്ങനെ?",
   [["With great joy","വലിയ സന്തോഷത്തോടെ"],["In great fear","വലിയ ഭയത്തോടെ"],["In sadness and tears","ദുഃഖത്തോടെയും കണ്ണീരോടെയും"],["Secretly at night","രാത്രിയിൽ രഹസ്യമായി"]],0,"",""],
  ["What was Jesus doing when He parted from the disciples?","ശിഷ്യന്മാരെ വിട്ടുപിരിയുമ്പോൾ യേശു എന്തു ചെയ്യുകയായിരുന്നു?",
   [["Blessing them","അവരെ അനുഗ്രഹിക്കുകയായിരുന്നു"],["Eating with them","അവരോടൊപ്പം ഭക്ഷിക്കുകയായിരുന്നു"],["Washing their feet","അവരുടെ കാൽ കഴുകുകയായിരുന്നു"],["Teaching in the temple","ദൈവാലയത്തിൽ പഠിപ്പിക്കുകയായിരുന്നു"]],0,
   "By blessing them Jesus fulfilled a priestly function (Luke 24:51).","അനുഗ്രഹിച്ചതിലൂടെ യേശു പുരോഹിതധർമ്മം നിറവേറ്റി (ലൂക്കോ. 24:51)."],
  ["In the Church, the strength of the Holy Spirit is given through anointing with…","പരിശുദ്ധാത്മശക്തി സഭയിൽ നൽകപ്പെടുന്നത് ഏത് അഭിഷേകത്തിലൂടെ?",
   [["Holy Chrism (Holy Mooron)","വി. മൂറോൻ"],["Olive oil only","ഒലിവെണ്ണ മാത്രം"],["Holy water","വി. ജലം"],["Incense","ധൂപം"]],0,"",""],
  ["On the Feast of Ascension, which cross is removed from the altar?","സ്വർഗ്ഗാരോഹണ ദിവസം മാറ്റുന്ന കുരിശ്?",
   [["The cross placed on the left side of the altar at Easter","ഉയിർപ്പ് പെരുന്നാളിൽ ത്രോണോസിന്റെ ഇടതുഭാഗത്ത് വച്ച കുരിശ്"],["The processional cross","പ്രദക്ഷിണ കുരിശ്"],["The hand cross of the priest","പുരോഹിതന്റെ കൈക്കുരിശ്"],["The cross on the church roof","ദേവാലയ മേൽക്കൂരയിലെ കുരിശ്"]],0,"",""],
  ["The Ascension is one of the Church’s…","സ്വർഗ്ഗാരോഹണം സഭയുടെ… ഒന്നാണ്.",
   [["Moronaya (Lord’s) feasts","മാറാനായ പെരുന്നാളുകളിൽ"],["Saints’ days","പരിശുദ്ധന്മാരുടെ ഓർമ്മദിവസങ്ങളിൽ"],["Fasting days","നോമ്പ് ദിവസങ്ങളിൽ"],["Harvest festivals","കൊയ്ത്തുത്സവങ്ങളിൽ"]],0,"",""],
  ["The memory verse of this chapter is from…","ഈ പാഠത്തിലെ മനഃപാഠവാക്യം ഏത് ഭാഗത്തുനിന്ന്?",
   [["Acts 1:11","അ. പ്ര. 1:11"],["St. Luke 24:51","ലൂക്കോ. 24:51"],["St. Matthew 28:20","മത്തായി 28:20"],["Acts 2:1","അ. പ്ര. 2:1"]],0,"",""]

 short:[
  {en:"Describe the Ascension of Jesus.", ml:"യേശുവിന്റെ സ്വർഗ്ഗാരോഹണം വിവരിക്കുക.",
   aen:["Jesus gathered His disciples on the Mount of Olives and told them to wait in Jerusalem for the Promise of the Father – baptism with the Holy Spirit – and then be His witnesses to the end of the earth. While blessing them He was taken up, and a cloud hid Him. Two angels in white said He would come again in the same way. The disciples returned to Jerusalem with great joy (Acts 1:6-12)."],
   aml:["യേശു ഒലിവുമലയിൽ ശിഷ്യന്മാരെ കൂട്ടി, പിതാവിന്റെ വാഗ്ദാനമായ പരിശുദ്ധാത്മസ്നാനത്തിനായി യെരുശലേമിൽ കാത്തിരിക്കാനും ഭൂമിയുടെ അറ്റത്തോളം സാക്ഷികളാകാനും കല്പിച്ചു. അവരെ അനുഗ്രഹിച്ചുകൊണ്ട് ആരോഹണം ചെയ്തു; ഒരു മേഘം അവനെ മറച്ചു. വെള്ളവസ്ത്രം ധരിച്ച രണ്ടുപേർ അവൻ വീണ്ടും വരുമെന്ന് വാഗ്ദാനം ചെയ്തു. ശിഷ്യന്മാർ വലിയ സന്തോഷത്തോടെ യെരുശലേമിലേക്ക് മടങ്ങി (അ. പ്ര. 1:6-12)."]},
  {en:"What did the risen Christ command His disciples before His Ascension?", ml:"സ്വർഗ്ഗാരോഹണത്തിനു മുമ്പ് കർത്താവ് ശിഷ്യന്മാരെ ഏല്പിച്ചത് എന്ത്?",
   aen:["Not to leave Jerusalem but wait for the Promise of the Father.","To receive the power of the Holy Spirit.","To be His witnesses in Jerusalem, Judea, Samaria and to the end of the earth."],
   aml:["യെരുശലേം വിട്ടുപോകാതെ പിതാവിന്റെ വാഗ്ദാനത്തിനായി കാത്തിരിക്കുക.","പരിശുദ്ധാത്മശക്തി പ്രാപിക്കുക.","യെരുശലേമിലും യെഹൂദ്യയിലും ശമര്യയിലും ഭൂമിയുടെ അറ്റത്തോളവും സാക്ഷികളാകുക."]},
  {en:"What is the significance of Jesus blessing the disciples as He departed?", ml:"കർത്താവ് ശിഷ്യന്മാരെ അനുഗ്രഹിച്ചത് എന്തിന്റെ പ്രതീകമാണ്?",
   aen:["By blessing them Jesus fulfilled a priestly function. His blessing strengthened them to witness for Christ, and they were even joyful to suffer for their Master. The Ascension did not disappoint them."],
   aml:["അനുഗ്രഹിക്കുന്നത് പുരോഹിതധർമ്മമാണ്; അത് കർത്താവ് നിറവേറ്റി. ആ അനുഗ്രഹം ക്രിസ്തുവിന് സാക്ഷ്യം വഹിക്കാനും ഗുരുവിനുവേണ്ടി സന്തോഷത്തോടെ കഷ്ടം സഹിക്കാനും ശിഷ്യന്മാരെ ശക്തരാക്കി."]},
  {en:"Resolution of this chapter", ml:"ഈ പാഠത്തിലെ നിശ്ചയം",
   aen:["We would carry out the mission Jesus has entrusted to us. We would take part in church services on the Feast of Ascension and live by the renewal of the Holy Spirit received in Holy Baptism."],
   aml:["യേശു ഏൽപ്പിച്ചിരിക്കുന്ന ദൗത്യങ്ങൾ നിർവഹിക്കും. സ്വർഗ്ഗാരോഹണ പെരുന്നാളിൽ ദേവാലയത്തിൽ ആരാധനയ്ക്ക് പങ്കെടുക്കും. വി. മാമോദീസായിൽകൂടി ലഭിച്ച പരിശുദ്ധാത്മാവിനെ പുതുക്കി ജീവിക്കും."]}
 ]
},
{
 id:"ch11", n:11, en:"Mar Ephrem’s Teachings (Memra)", ml:"മാർ അപ്രേമിന്റെ മെമ്രാ",
 verse:{en:"“I will both lie down in peace and sleep; for You alone, O Lord, make me dwell in safety.”", ml:"“ഞാൻ സമാധാനത്തോടെ കിടന്നുറങ്ങും; നീയല്ലോ യഹോവേ എന്നെ നിർഭയം വസിക്കുമാറാക്കുന്നത്”", ref:"Psalm 4:8 · സങ്കീ. 4:8"},
 mcq:[
  ["Who composed this Memra?","ഈ മെമ്രാ രചിച്ചത് ആര്?",

  ["In which prayer is this Memra used?","ഈ മെമ്രാ ഏത് നമസ്കാരത്തിൽ ഉപയോഗിക്കുന്നു?",
   [["Compline (Soothara)","സൂത്താറാ നമസ്കാരം"],["Morning prayer","പ്രഭാത നമസ്കാരം"],["Third hour (Terce)","മൂന്നാം മണി നമസ്കാരം"],["Sixth hour","ആറാം മണി നമസ്കാരം"]],0,"",""],

  ["How does the English Memra begin?","മെമ്രായുടെ ഇംഗ്ലീഷ് രൂപം ആരംഭിക്കുന്നത് എങ്ങനെ?",
   [["“Lord, Thy mercy on us cast”","“Lord, Thy mercy on us cast” (കർത്താവേ കൃപ ചെയ്യേണമേ)"],["“O our Father, who art in Heaven”","“O our Father, who art in Heaven”"],["“O Lord, who sittest in the secret place”","“O Lord, who sittest in the secret place”"],["“Judge of judges above all”","“Judge of judges above all”"]],0,
   "In Malayalam: “ഞങ്ങൾക്കുള്ള കർത്താവേ…” or “കർത്താവേ കൃപ ചെയ്യേണമേ…”.","മലയാളത്തിൽ: “ഞങ്ങൾക്കുള്ള കർത്താവേ…” അല്ലെങ്കിൽ “കർത്താവേ കൃപ ചെയ്യേണമേ…”."],
  ["By what do we ask the Lord to give us a restful sleep?","എന്തിനാൽ സുഖനിദ്ര തരണമെന്നാണ് നാം അപേക്ഷിക്കുന്നത്?",
   [["By His Cross","തന്റെ സ്ലീബായാൽ (കുരിശിനാൽ)"],["By our good works","നമ്മുടെ നല്ല പ്രവൃത്തികളാൽ"],["By our wealth","നമ്മുടെ ധനത്താൽ"],["By a soft bed","മൃദുവായ കിടക്കയാൽ"]],0,"",""],
  ["In “തവക്ഷീണത്തിൽ സ്ലീബായാൽ”, the word ‘തവക്ഷീണം’ (Thy disgrace) refers to…","‘തവക്ഷീണം’ എന്ന വാക്ക് എന്തിനെ കുറിക്കുന്നു?",
   [["The Lord’s suffering (Passion)","കർത്താവിന്റെ കഷ്ടാനുഭവം"],["Tiredness after a day’s work","പകൽ അദ്ധ്വാനിച്ചതിന്റെ ക്ഷീണം"],["Tiredness from God’s work","ദൈവവേലയാലുള്ള ക്ഷീണം"],["Trials of the night","രാത്രിയിലെ പരീക്ഷകൾ"]],0,"",""],
  ["Whom do we ask God to send to guard our body at night?","രാത്രിയിൽ ശരീരം കാക്കാൻ ആരെ അയയ്ക്കണമെന്നാണ് അപേക്ഷ?",
   [["The angel of light","പ്രകാശത്തിന്റെ (വെളിവിൻ) ദൂതനെ"],["A soldier","ഒരു പടയാളിയെ"],["Our parents","മാതാപിതാക്കളെ"],["A priest","ഒരു പുരോഹിതനെ"]],0,"",""],
  ["By whose prayers do we ask that the evil one not come near our bed?","ആരുടെ പ്രാർത്ഥനയാൽ ദുഷ്ടൻ കിടക്കയോട് അടുക്കരുതേ എന്നാണ് അപേക്ഷ?",
   [["St. Mary, the Mother of the Lord","കർത്താവിന്റെ അമ്മയായ വി. മറിയം"],["St. Peter","പത്രോസ് ശ്ലീഹാ"],["Mar Ephrem","മാർ അപ്രേം"],["The angels","മാലാഖമാർ"]],0,"",""],
  ["The Memra says God created us in His…","മെമ്രാ പ്രകാരം ദൈവം നമ്മെ സൃഷ്ടിച്ചത്…",
   [["Own image (likeness)","തന്റെ സാദൃശ്യത്തിൽ"],["Anger","കോപത്തിൽ"],["Sleep","ഉറക്കത്തിൽ"],["Absence","അസാന്നിധ്യത്തിൽ"]],0,"",""],
  ["The Memra describes Jesus as one who dwells in…","യേശു വസിക്കുന്നത് എവിടെയെന്നാണ് മെമ്രാ പറയുന്നത്?",
   [["Light","വെളിച്ചത്തിൽ (വെളിവിൽ)"],["Darkness","ഇരുട്ടിൽ"],["The sea","കടലിൽ"],["The desert","മരുഭൂമിയിൽ"]],0,"",""],
  ["“One in Three, and Three in One” refers to…","“മൂന്നിൽ ഒന്നും ഒന്നിൽ മൂന്നും” എന്നത് ആരെ കുറിക്കുന്നു?",
   [["The Holy Trinity","പരിശുദ്ധ ത്രിത്വം (ത്രിയേക ദൈവം)"],["Three apostles","മൂന്ന് ശ്ലീഹന്മാർ"],["Three angels","മൂന്ന് ദൂതന്മാർ"],["Three prayers","മൂന്ന് പ്രാർത്ഥനകൾ"]],0,"",""],
  ["In the Malayalam hymn, ‘സന്ധുക്കൾ’ means…","‘സന്ധുക്കൾ’ എന്ന വാക്കിന്റെ അർത്ഥം?",
   [["Limbs / parts of the body","അവയവങ്ങൾ"],["Friends","സുഹൃത്തുക്കൾ"],["Prayers","പ്രാർത്ഥനകൾ"],["Dreams","സ്വപ്നങ്ങൾ"]],0,"",""],
  ["In the Malayalam hymn, ‘തണ്യവർ’ means…","‘തണ്യവർ’ എന്ന വാക്കിന്റെ അർത്ഥം?",
   [["The wicked","ദുഷ്ടന്മാർ"],["Angels","മാലാഖമാർ"],["Saints","പരിശുദ്ധന്മാർ"],["Children","കുട്ടികൾ"]],0,"",""],
  ["In the Malayalam hymn, ‘ഉപവി’ means…","‘ഉപവി’ എന്ന വാക്കിന്റെ അർത്ഥം?",
   [["Love","സ്നേഹം"],["Fasting","ഉപവാസം"],["Strength","ശക്തി"],["Fear","ഭയം"]],0,"",""],
  ["‘ഈറയർ’ in the hymn refers to…","‘ഈറയർ’ എന്നത് ആരെ കുറിക്കുന്നു?",
   [["Watchful (sleepless) angels","ഉറക്കമില്ലാത്ത മാലാഖമാർ"],["Shepherds","ഇടയന്മാർ"],["Kings","രാജാക്കന്മാർ"],["Sinners","പാപികൾ"]],0,"",""],
  ["‘Grant us from Thy treasure vast’ – the Malayalam word ‘അറ’ means…","‘അറ’ എന്ന വാക്കിന്റെ അർത്ഥം?",
   [["Treasury","ഭണ്ഡാരം (സൂക്ഷിച്ചുവയ്ക്കുന്ന സ്ഥലം)"],["Room for sleeping","ഉറങ്ങുന്ന മുറി"],["Altar","ബലിപീഠം"],["Gate","വാതിൽ"]],0,"",""],
  ["‘ഇഹലോകം’ and ‘പരലോകം’ mean…","‘ഇഹലോകം’, ‘പരലോകം’ എന്നിവയുടെ അർത്ഥം?",
   [["This world (earth) and heaven","ഭൂമിയും സ്വർഗ്ഗവും"],["Day and night","പകലും രാത്രിയും"],["Body and soul","ശരീരവും ആത്മാവും"],["East and west","കിഴക്കും പടിഞ്ഞാറും"]],0,"",""],
  ["The memory verse of this chapter is from…","ഈ പാഠത്തിലെ മനഃപാഠവാക്യം ഏത് ഭാഗത്തുനിന്ന്?",
   [["Psalm 4:8","സങ്കീ. 4:8"],["Psalm 91:1","സങ്കീ. 91:1"],["Psalm 61:4","സങ്കീ. 61:4"],["Psalm 119:164","സങ്കീ. 119:164"]],0,"",""]
 ],
 short:[
  {en:"Write the meaning of the first stanza: “Lord, Thy mercy on us cast…”", ml:"“കർത്താവേ കൃപ ചെയ്യേണമേ…” എന്ന ഒന്നാം ഖണ്ഡത്തിന്റെ അർത്ഥം എഴുതുക.",
   aen:["O Jesus Christ, accept our service and prayer and shower Your mercy on us. Forgive us our sins. Give us mercy and blessing from Your great treasury of blessings."],
   aml:["കർത്താവേ, ഞങ്ങളുടെ ശുശ്രൂഷയും പ്രാർത്ഥനയും കൈക്കൊണ്ട് ഞങ്ങളിൽ കൃപ ചൊരിയേണമേ. പാപക്ഷമ നൽകുകയും നിന്റെ അനുഗ്രഹങ്ങളുടെ ഭണ്ഡാരത്തിൽനിന്ന് ഞങ്ങൾക്ക് അനുഗ്രഹം നൽകുകയും ചെയ്യേണമേ."]},
  {en:"What do we ask for our sleep in this Memra?", ml:"ഈ മെമ്രായിൽ ഉറക്കത്തിനായി നാം അപേക്ഷിക്കുന്നത് എന്തെല്ലാം?",
   aen:["That sin may not touch us while we sleep.","A restful sleep through the Lord’s Cross, free from evil dreams and wicked thoughts.","That the angel of light guards our body.","That the Lord’s blood keeps watch over us.","That the evil one does not come near our bed, by St. Mary’s prayers."],
   aml:["ഉറക്കത്തിൽ പാപം നമ്മെ സ്പർശിക്കരുത്.","കർത്താവിന്റെ കുരിശിനാൽ ദുഃസ്വപ്നങ്ങളും ദുഷ്ചിന്തകളുമില്ലാത്ത സുഖനിദ്ര.","പ്രകാശത്തിന്റെ ദൂതൻ ശരീരം കാക്കണം.","കർത്താവിന്റെ തിരുരക്തം കാവലാകണം.","വി. മറിയത്തിന്റെ പ്രാർത്ഥനയാൽ ദുഷ്ടൻ കിടക്കയോട് അടുക്കരുത്."]},
  {en:"Write the meaning of the stanza about the Holy Trinity.", ml:"ത്രിത്വത്തെക്കുറിച്ചുള്ള ഖണ്ഡത്തിന്റെ അർത്ഥം എഴുതുക.",
   aen:["We praise the Triune God, who exists as one God in three persons – Father, Son and Holy Spirit – One in Three and Three in One. He is the only true God."],
   aml:["ഏകത്തിൽ ത്രിത്വവും ത്രിത്വത്തിൽ ഏകവുമായി (മൂന്നിൽ ഒന്നും ഒന്നിൽ മൂന്നും) സ്ഥിതിചെയ്യുന്ന പിതാവും പുത്രനും പരിശുദ്ധാത്മാവുമായ സത്യേക ദൈവമേ, നിനക്കു സ്തോത്രം."]},
  {en:"Resolution of this chapter", ml:"ഈ പാഠത്തിലെ നിശ്ചയം",
   aen:["We would pray regularly in the evenings at our homes, and sing this prayer understanding its meaning fully."],
   aml:["ഞങ്ങൾ എല്ലാദിവസവും ഭവനത്തിൽ സന്ധ്യാപ്രാർത്ഥന നടത്തുകയും അതോടൊപ്പമുള്ള ഈ പ്രാർത്ഥന അർത്ഥം മനസ്സിലാക്കി ചൊല്ലുകയും ചെയ്യും."]}
 ]
},
{
 id:"ch12", n:12, en:"The Prayer ‘O our Father, who art in Heaven…’ (Third Hour)", ml:"മൂന്നാംമണി നമസ്കാരത്തിലെ ‘സ്വർഗ്ഗസ്ഥനായ ഞങ്ങളുടെ പിതാവേ നിന്നെ വിളിക്കുന്നു…’",
 verse:{en:"“So I say to you, ask and it will be given to you; seek, and you will find; knock, and it will be opened to you.”", ml:"“യാചിപ്പിൻ എന്നാൽ നിങ്ങൾക്കു കിട്ടും; അന്വേഷിപ്പിൻ എന്നാൽ നിങ്ങൾ കണ്ടെത്തും; മുട്ടുവിൻ എന്നാൽ നിങ്ങൾക്കു തുറക്കും”", ref:"St. Luke 11:9 · ലൂക്കോ. 11:9"},
 mcq:[
  ["This prayer is part of which canonical hour?","ഈ പ്രാർത്ഥന ഏത് യാമപ്രാർത്ഥനയിലേതാണ്?",
   [["Third hour (Terce)","മൂന്നാം മണി നമസ്കാരം"],["Compline (Soothara)","സൂത്താറാ നമസ്കാരം"],["Sixth hour","ആറാം മണി നമസ്കാരം"],["Midnight prayer","പാതിരാ നമസ്കാരം"]],0,"",""],
  ["At what time is the Third hour prayer said in the Malankara Orthodox Church?","മലങ്കര സഭയിൽ മൂന്നാം മണി നമസ്കാരം നടത്തുന്ന സമയം?",
   [["9 o’clock in the morning","രാവിലെ 9 മണി"],["6 o’clock in the morning","രാവിലെ 6 മണി"],["12 noon","ഉച്ചയ്ക്ക് 12 മണി"],["3 o’clock in the afternoon","ഉച്ചകഴിഞ്ഞ് 3 മണി"]],0,"",""],
  ["How many canonical hours of prayer are there in our Orthodox tradition?","ഓർത്തഡോക്സ് ആരാധനാ പാരമ്പര്യത്തിൽ എത്ര യാമപ്രാർത്ഥനകൾ ഉണ്ട്?",
   [["Seven","ഏഴ്"],["Three","മൂന്ന്"],["Five","അഞ്ച്"],["Twelve","പന്ത്രണ്ട്"]],0,"",""],
  ["“Seven times a day I praise You because of Your righteous judgements” is from…","“നിന്റെ നീതിയുള്ള വിധികൾ നിമിത്തം ഞാൻ ദിവസം ഏഴു പ്രാവശ്യം നിന്നെ സ്തുതിക്കുന്നു” – ഏത് വാക്യം?",
   [["Psalm 119:164","സങ്കീ. 119:164"],["Psalm 4:8","സങ്കീ. 4:8"],["Psalm 91:1","സങ്കീ. 91:1"],["Psalm 63:8","സങ്കീ. 63:8"]],0,"",""],
  ["On which day are penitential hymns NOT used in the Third hour prayers?","ഏത് ദിവസമാണ് മൂന്നാം മണിയിൽ അനുതാപഗീതങ്ങൾ ഉപയോഗിക്കാത്തത്?",
   [["Sunday","ഞായറാഴ്ച"],["Friday","വെള്ളിയാഴ്ച"],["Wednesday","ബുധനാഴ്ച"],["Saturday","ശനിയാഴ്ച"]],0,"",""],
  ["Addressing God as ‘Father’ shows that…","ദൈവത്തെ ‘പിതാവേ’ എന്ന് വിളിക്കുന്നത് വ്യക്തമാക്കുന്നത്…",
   [["We are His children with an intimate relationship (Rom. 8:17)","നാം ദൈവമക്കളാണ്; ദൈവവുമായി അടുത്ത ബന്ധമുണ്ട് (റോമ. 8:17)"],["God is far away and angry","ദൈവം അകലെയും കോപിഷ്ഠനുമാണ്"],["We are God’s servants only","നാം ദൈവത്തിന്റെ ദാസന്മാർ മാത്രം"],["God is like an earthly king","ദൈവം ഭൂമിയിലെ ഒരു രാജാവിനെപ്പോലെ"]],0,"",""],
  ["In this prayer the word ‘heaven’ means…","ഈ പ്രാർത്ഥനയിൽ ‘സ്വർഗ്ഗം’ എന്ന പദം വിവക്ഷിക്കുന്നത്…",
   [["The mysterious place of God’s presence","ദൈവസാന്നിധ്യത്തിന്റെ രഹസ്യാത്മകമായ സ്ഥാനം"],["The sky and clouds","ആകാശവും മേഘങ്ങളും"],["The temple in Jerusalem","യെരുശലേം ദൈവാലയം"],["A beautiful garden","മനോഹരമായ ഉദ്യാനം"]],0,"",""],
  ["“We have no other Father who can help us” speaks of our…","“ഞങ്ങളെ സഹായിപ്പാൻ കഴിയുന്ന പിതാവ് ഞങ്ങൾക്ക് വേറെയില്ല” എന്നത് സൂചിപ്പിക്കുന്നത്…",
   [["Complete reliance on God","ദൈവത്തിലുള്ള സമ്പൂർണ്ണ ആശ്രയം"],["Loneliness","ഏകാന്തത"],["Pride","അഹങ്കാരം"],["Doubt","സംശയം"]],0,"",""],
  ["God created us from…","ദൈവം നമ്മെ സൃഷ്ടിച്ചത്…",
   [["Nothingness, by His own will","തിരുവുള്ളത്താൽ ഇല്ലായ്മയിൽനിന്ന്"],["Water","വെള്ളത്തിൽനിന്ന്"],["Light","പ്രകാശത്തിൽനിന്ന്"],["The angels","മാലാഖമാരിൽനിന്ന്"]],0,
   "Genesis 1:27; St. John 1:3.","ഉല്പത്തി 1:27; യോഹ. 1:3."],
  ["God’s anger is softened through…","ദൈവകോപം നീങ്ങുന്നത് എന്തിലൂടെ?",
   [["His mercy and our repentance","ദൈവകരുണയും നമ്മുടെ അനുതാപവും"],["Our wealth","നമ്മുടെ ധനം"],["Sacrificing animals only","മൃഗബലി മാത്രം"],["Hiding from God","ദൈവത്തിൽനിന്ന് ഒളിക്കുന്നത്"]],0,"",""],
  ["Through whom did God give the Ten Commandments?","പത്ത് കല്പനകൾ ദൈവം ആരിലൂടെ നൽകി?",
   [["Moses","മോശ"],["David","ദാവീദ്"],["Samuel","ശമുവേൽ"],["Elijah","ഏലിയാവ്"]],0,"",""],
  ["To understand God’s commandments, who should guide us?","ദൈവകല്പനകളുടെ പൊരുൾ മനസ്സിലാക്കാൻ നമ്മെ പഠിപ്പിക്കേണ്ടത്?",
   [["The Spirit of God","ദൈവാത്മാവ്"],["Our friends","സുഹൃത്തുക്കൾ"],["The newspaper","പത്രം"],["Our own feelings","നമ്മുടെ വികാരങ്ങൾ"]],0,
   "St. John 16:13.","യോഹ. 16:13."],
  ["Fill in: “Therefore you shall be ___, just as your Father in heaven is ___.” (Matt. 5:48)","പൂരിപ്പിക്കുക: “ആകയാൽ നിങ്ങളുടെ സ്വർഗ്ഗീയ പിതാവ് ___ ആയിരിക്കുന്നതുപോലെ നിങ്ങളും ___ ആകുവിൻ” (മത്താ. 5:48)",
   [["perfect … perfect","സൽഗുണസമ്പൂർണ്ണൻ … സൽഗുണസമ്പൂർണ്ണർ"],["holy … holy","പരിശുദ്ധൻ … പരിശുദ്ധർ"],["kind … kind","ദയയുള്ളവൻ … ദയയുള്ളവർ"],["strong … strong","ശക്തൻ … ശക്തർ"]],0,"",""],
  ["What gift pleases God most?","ദൈവത്തിന് ഏറ്റവും ഇഷ്ടമുള്ള കാഴ്ച?",
   [["Virtuous (good) deeds","പുണ്യപ്രവൃത്തികൾ"],["Gold and silver","പൊന്നും വെള്ളിയും"],["Long prayers only","നീണ്ട പ്രാർത്ഥനകൾ മാത്രം"],["Expensive candles","വിലകൂടിയ മെഴുകുതിരികൾ"]],0,"",""],
  ["The memory verse of this chapter is from…","ഈ പാഠത്തിലെ മനഃപാഠവാക്യം ഏത് ഭാഗത്തുനിന്ന്?",
   [["St. Luke 11:9","ലൂക്കോ. 11:9"],["St. Matthew 5:48","മത്താ. 5:48"],["Romans 8:17","റോമ. 8:17"],["St. John 16:13","യോഹ. 16:13"]],0,"",""]
 ],
 short:[
  {en:"Write the prayer “O our Father, who art in Heaven…” (Third hour).", ml:"“സ്വർഗ്ഗസ്ഥനായ പിതാവേ…” എന്ന പ്രാർത്ഥന എഴുതുക.",
   aen:["O our Father, who art in Heaven, answer us who beseech Thee; for we have no other Father who can help us. Thou hast created us from nothingness out of Thy will; do not let Thy anger destroy us, Thy creatures. O Lord, teach us to observe Thy commandments. May we become pleasing to Thee by our good deeds; O Lord, have compassion and mercy upon us. O Lord Jesus Christ, come to our aid; hear our supplication and have mercy on our souls."],
   aml:["സ്വർഗ്ഗസ്ഥനായ പിതാവേ, നിന്നെ വിളിക്കുന്ന ഞങ്ങളോട് ഉത്തരമരുളേണമേ. എന്തെന്നാൽ ഞങ്ങളെ സഹായിപ്പാൻ കഴിയുന്ന പിതാവ് ഞങ്ങൾക്ക് വേറെയില്ല. തിരുവുള്ളത്താൽ ഇല്ലായ്മയിൽനിന്ന് ഞങ്ങളെ നീ സൃഷ്ടിച്ചു; ഞങ്ങൾ സൃഷ്ടിക്കപ്പെട്ട ശേഷം നിന്റെ കോപം ഞങ്ങളെ നശിപ്പിച്ചുകളയരുതേ. കർത്താവേ നിന്റെ കല്പനകൾ ആചരിപ്പാൻ ഞങ്ങളെ പഠിപ്പിക്കേണമേ. പുണ്യപ്രവൃത്തികളാൽ ഞങ്ങൾ നിനക്ക് ഇഷ്ടന്മാരായി തീരണമേ; കർത്താവേ കൃപയുണ്ടായി ഞങ്ങളോട് കരുണ ചെയ്യേണമേ. ഞങ്ങളുടെ നാഥനായ കർത്താവേ ഞങ്ങളുടെ സഹായത്തിന് വരണമേ. ഞങ്ങളുടെ അപേക്ഷ കേട്ട് ഞങ്ങളുടെ ആത്മാക്കൾമേൽ കരുണ ചെയ്യേണമേ."]},
  {en:"Explain the significance of addressing God as ‘Father’.", ml:"ദൈവത്തെ ‘പിതാവേ’ എന്ന് സംബോധന ചെയ്യുന്നതിന്റെ പ്രാധാന്യം വ്യക്തമാക്കുക.",
   aen:["We are all children of God (Rom. 8:17). God has given us the right to approach Him freely as His children. He wants a close relationship with us, like a father and his children. Calling God ‘Father’ makes the relationship between God and us deeper. ‘Who art in heaven’ refers to God who is beyond our understanding, yet very loving towards us."],
   aml:["നാം എല്ലാവരും ദൈവമക്കളാണ് (റോമ. 8:17). മക്കളെന്ന നിലയിൽ സ്വാതന്ത്ര്യത്തോടെ ദൈവത്തെ സമീപിക്കാനുള്ള അവകാശം ദൈവം നൽകിയിരിക്കുന്നു. പിതാവും മക്കളും പോലെയുള്ള അടുത്ത ബന്ധമാണ് ദൈവം ആഗ്രഹിക്കുന്നത്. ‘പിതാവേ’ എന്ന് വിളിക്കുമ്പോൾ ആ ബന്ധം ആഴപ്പെടുന്നു. ‘സ്വർഗ്ഗസ്ഥനായ’ എന്നത് നമ്മുടെ ബുദ്ധിക്ക് അതീതനായ, എന്നാൽ നമ്മോട് വാത്സല്യമുള്ള ദൈവത്തെ കുറിക്കുന്നു."]},
  {en:"Name the seven canonical hours of prayer.", ml:"ഏഴ് യാമപ്രാർത്ഥനകൾ ഏതെല്ലാം?",
   aen:["Evening (Vespers)","Compline (Soothara)","Midnight","Morning (Matins)","Third hour (Terce)","Sixth hour (Sext)","Ninth hour (None)"],
   aml:["സന്ധ്യാ നമസ്കാരം","സൂത്താറാ നമസ്കാരം","പാതിരാ നമസ്കാരം","പ്രഭാത നമസ്കാരം","മൂന്നാം മണി നമസ്കാരം","ആറാം മണി നമസ്കാരം","ഒമ്പതാം മണി നമസ്കാരം"]},
  {en:"Resolution of this chapter", ml:"ഈ പാഠത്തിലെ നിശ്ചയം",
   aen:["We would say the Third hour prayer beginning “O our Father, who art in Heaven…” regularly every morning and meditate on it."],
   aml:["മൂന്നാംമണി നമസ്കാരത്തിലെ “സ്വർഗ്ഗസ്ഥനായ ഞങ്ങളുടെ പിതാവേ നിന്നെ വിളിക്കുന്നു…” എന്ന പ്രാർത്ഥന അർത്ഥം മനസ്സിലാക്കി ഭംഗിയായി ഞങ്ങൾ എന്നും പ്രഭാതത്തിൽ പ്രാർത്ഥിക്കും."]}
 ]
},
{
 id:"ch13", n:13, en:"The Prayer ‘O Lord, who sittest in the secret place of the Most High…’ (Compline)", ml:"സൂത്താറ നമസ്കാരത്തിലെ ‘മഹോന്നതന്റെ മറവിൽ ഇരിക്കുന്ന കർത്താവേ…’",
 verse:{en:"“I will abide in Your tabernacle forever; I will trust in the shelter of Your wings.”", ml:"“ഞാൻ നിന്റെ കൂടാരത്തിൽ എന്നേക്കും വസിക്കും; നിന്റെ ചിറകിൻ മറവിൽ ഞാൻ ശരണം പ്രാപിക്കും”", ref:"Psalm 61:4 · സങ്കീ. 61:4"},
 mcq:[
  ["Who composed the prayer “O Lord, who sittest in the secret place of the Most High…”?","“മഹോന്നതന്റെ മറവിൽ ഇരിക്കുന്ന കർത്താവേ…” എന്ന പ്രാർത്ഥന രചിച്ചത് ആര്?",
   [["Mar Severios","മാർ സേവേറിയോസ്"],["Mar Ephrem","മാർ അപ്രേം"],["Mar Baselios","മാർ ബസേലിയോസ്"],["Mar Gregorios","മാർ ഗ്രീഗോറിയോസ്"]],0,"",""],
  ["In which prayer is it said?","ഇത് ഏത് നമസ്കാരത്തിൽ ചൊല്ലുന്നു?",

  ["This prayer is based on which Psalm?","ഈ പ്രാർത്ഥന ഏത് സങ്കീർത്തനത്തെ അടിസ്ഥാനമാക്കിയാണ്?",
   [["Psalm 91","91-ാം സങ്കീർത്തനം"],["Psalm 23","23-ാം സങ്കീർത്തനം"],["Psalm 51","51-ാം സങ്കീർത്തനം"],["Psalm 4","4-ാം സങ്കീർത്തനം"]],0,
   "It is said after reciting Psalm 91 at Compline.","സൂത്താറയിൽ 91-ാം സങ്കീർത്തനം ചൊല്ലിയശേഷം ഈ പ്രാർത്ഥന ചൊല്ലുന്നു."],
  ["We pray to be sheltered under the wings of God’s mercy, like…","ദൈവകരുണയുടെ ചിറകിൻകീഴിൽ മറയ്ക്കണമേ എന്ന അപേക്ഷ എന്തിനോട് ഉപമിക്കാം?",
   [["Chicks protected under the mother bird’s wings","തള്ളപ്പക്ഷി ചിറകുകൊണ്ട് കുഞ്ഞുങ്ങളെ സംരക്ഷിക്കുന്നതുപോലെ"],["A ship in a harbour","തുറമുഖത്തിലെ കപ്പൽ പോലെ"],["A soldier behind a shield","പരിചയ്ക്കു പിന്നിലെ പടയാളി പോലെ"],["A house with strong walls","ബലമുള്ള മതിലുള്ള വീട് പോലെ"]],0,"",""],
  ["The title ‘Most High’ is used for…","‘മഹോന്നതൻ / അത്യുന്നതൻ’ എന്ന പദം ആരെ സംബോധന ചെയ്യുന്നു?",

  ["What do we ask the Messiah, our Saviour, to grant us?","രക്ഷകനായ മശിഹായോട് നാം അപേക്ഷിക്കുന്നത്?",

  ["In this prayer, Jesus is called…","ഈ പ്രാർത്ഥനയിൽ യേശുവിനെ വിളിക്കുന്നത്…",

  ["“Unto Thee our eyes are lifted up” means…","“ഞങ്ങളുടെ കണ്ണുകൾ നിങ്കലേക്ക് നോക്കിക്കൊണ്ടിരിക്കുന്നു” എന്നതിന്റെ അർത്ഥം…",
   [["We rely on God for all our needs","എല്ലാ കാര്യങ്ങളിലും നാം ദൈവത്തിൽ ആശ്രയിക്കുന്നു"],["We look at the stars","നാം നക്ഷത്രങ്ങളെ നോക്കുന്നു"],["We are unable to sleep","നമുക്ക് ഉറങ്ങാൻ കഴിയുന്നില്ല"],["We look for the sunrise","നാം സൂര്യോദയം നോക്കുന്നു"]],0,"",""],
  ["We ask for mercy in which worlds?","ഏതെല്ലാം ലോകങ്ങളിൽ കരുണ ചെയ്യണമെന്നാണ് അപേക്ഷ?",
   [["Both this world and the world to come","ഇഹവും പരവുമായ രണ്ടു ലോകങ്ങളിലും"],["Only this world","ഈ ലോകത്തിൽ മാത്രം"],["Only in heaven","സ്വർഗ്ഗത്തിൽ മാത്രം"],["Only at night","രാത്രിയിൽ മാത്രം"]],0,"",""],
  ["What protects us from the evil one and his hosts?","ദുഷ്ടനിൽനിന്നും അവന്റെ സൈന്യങ്ങളിൽനിന്നും നമ്മെ കാക്കുന്നത്?",
   [["The Holy Cross","വി. സ്ലീബാ (കുരിശ്)"],["A strong door","ബലമുള്ള വാതിൽ"],["A lamp","ഒരു വിളക്ക്"],["Our own strength","നമ്മുടെ സ്വന്തം ശക്തി"]],0,
   "The Holy Cross is the sign of salvation.","വി. സ്ലീബാ രക്ഷയുടെ അടയാളമാണ്."],
  ["“God’s right hand” in this prayer indicates…","‘ദൈവത്തിന്റെ വലതുകൈ’ എന്ന പ്രയോഗം സൂചിപ്പിക്കുന്നത്…",
   [["God’s wonderful work and protection","ദൈവത്തിന്റെ അത്ഭുതകരമായ പ്രവർത്തനവും സംരക്ഷണവും"],["God’s anger","ദൈവകോപം"],["A blessing for the rich only","ധനികർക്കു മാത്രമുള്ള അനുഗ്രഹം"],["A sign of punishment","ശിക്ഷയുടെ അടയാളം"]],0,"",""],
  ["Fill in: “My ___ follows close behind You; Your ___ upholds me.” (Psalm 63:8)","പൂരിപ്പിക്കുക: “എന്റെ ___ നിന്നോട് പറ്റിയിരിക്കുന്നു; നിന്റെ ___ എന്നെ താങ്ങുന്നു” (സങ്കീ. 63:8)",
   [["soul … right hand","ഉള്ളം … വലങ്കൈ"],["heart … word","ഹൃദയം … വചനം"],["eyes … light","കണ്ണ് … വെളിച്ചം"],["feet … path","കാൽ … വഴി"]],0,"",""],
  ["God’s peace is…","ദൈവം നൽകുന്ന സമാധാനം…",
   [["Eternal, not as the world gives (John 14:27)","ലോകം തരുന്നതുപോലെയല്ല; നിത്യമാണ് (യോഹ. 14:27)"],["Only for one day","ഒരു ദിവസത്തേക്ക് മാത്രം"],["Bought with money","പണംകൊടുത്ത് വാങ്ങുന്നത്"],["Same as the world’s peace","ലോകം തരുന്നതുപോലെ തന്നെ"]],0,"",""],
  ["The prayer ends asking for the intercession of…","പ്രാർത്ഥന അവസാനിക്കുന്നത് ആരുടെ മദ്ധ്യസ്ഥത അപേക്ഷിച്ചുകൊണ്ട്?",
   [["St. Mary and all the saints","വി. മറിയാമിന്റെയും സകല പരിശുദ്ധന്മാരുടെയും"],["The twelve apostles only","പന്ത്രണ്ട് ശ്ലീഹന്മാരുടെ മാത്രം"],["Moses and Elijah","മോശയുടെയും ഏലിയാവിന്റെയും"],["Mar Severios","മാർ സേവേറിയോസിന്റെ"]],0,"",""],
  ["In “forgive us our debts”, ‘debt’ means…","‘കടങ്ങൾ’ എന്നതിന്റെ അർത്ഥം…",
   [["The many things we owe to God","നാം ദൈവത്തോട് കടപ്പെട്ടിരിക്കുന്ന അനേകം കാര്യങ്ങൾ"],["Money we owe the bank","ബാങ്കിൽ കൊടുക്കാനുള്ള പണം"],["Homework not done","ചെയ്യാത്ത ഗൃഹപാഠം"],["Taxes","നികുതി"]],0,"",""],
  ["The memory verse of this chapter is from…","ഈ പാഠത്തിലെ മനഃപാഠവാക്യം ഏത് ഭാഗത്തുനിന്ന്?",
   [["Psalm 61:4","സങ്കീ. 61:4"],["Psalm 91:1","സങ്കീ. 91:1"],["Psalm 63:8","സങ്കീ. 63:8"],["Psalm 4:8","സങ്കീ. 4:8"]],0,"",""]
 ],
 short:[
  {en:"Write the prayer “O Lord, who sittest in the secret place of the Most High…”.", ml:"“മഹോന്നതന്റെ മറവിൽ ഇരിക്കുന്ന കർത്താവേ…” എന്ന പ്രാർത്ഥന എഴുതുക.",
   aen:["O Lord, who sittest in the secret place of the Most High, shelter us beneath the shadow of the wings of Thy mercy, and have compassion upon us. Thou, who hearest all things, in Thy loving kindness hearken to the supplication of Thy servants. Grant us, O Messiah, our Saviour, a peaceful evening and a sinless night, for Thou art a glorious King. Unto Thee our eyes are lifted up; forgive our debts and our sins; have mercy upon us, both in this world and in that to come. May Thy loving kindness shelter us, O Lord, and Thy grace be upon our faces. May Thy cross protect us from the evil one and his hosts. Let Thy right hand overshadow us all the days of our lives. Let Thy peace reign among us, and give hope and salvation to the souls that pray to Thee. By the prayers of St. Mary, Thy mother, and of all Thy saints, O God, forgive us our debts and have mercy upon us."],
   aml:["മഹോന്നതന്റെ മറവിൽ ഇരിക്കുന്ന കർത്താവേ, നിന്റെ കരുണയുടെ ചിറകിൻകീഴിൽ ഞങ്ങളെ മറച്ച് ഞങ്ങളോട് കരുണ ചെയ്യേണമേ. സകലവും കേൾക്കുന്നവനേ, നിന്റെ കരുണയാൽ നിന്റെ അടിയാരുടെ അപേക്ഷ നീ കേൾക്കേണമേ. മഹത്വമുള്ള രാജാവായ, ഞങ്ങളുടെ രക്ഷകനായ മശിഹാ, സമാധാനം നിറഞ്ഞ സന്ധ്യയും പുണ്യമുള്ള രാവും ഞങ്ങൾക്കു തരേണമേ. ഞങ്ങളുടെ കണ്ണുകൾ നിങ്കലേക്ക് നോക്കിക്കൊണ്ടിരിക്കുന്നു. ഞങ്ങളുടെ കടങ്ങളും പാപങ്ങളും പുണ്യപ്പെടുത്തി ഇഹവും പരവുമായ രണ്ടു ലോകങ്ങളിലും കരുണ ചെയ്യേണമേ. കർത്താവേ നിന്റെ കരുണ ഞങ്ങളെ മറച്ച് നിന്റെ കൃപ ഞങ്ങളുടെ മുഖങ്ങളിൽ നിൽക്കണമേ. നിന്റെ സ്ലീബാ ദുഷ്ടനിൽനിന്നും അവന്റെ സൈന്യങ്ങളിൽനിന്നും ഞങ്ങളെ കാത്തുകൊള്ളേണമേ. ഞങ്ങൾ ജീവനോടിരിക്കുന്ന നാളുകളിലൊക്കെയും നിന്റെ വലതുകൈ ഞങ്ങളുടെമേൽ ആവസിപ്പിക്കേണമേ. നിന്റെ സമാധാനം ഞങ്ങളുടെ ഇടയിൽ വാഴുമാറാകണമേ. നിന്നോടപേക്ഷിക്കുന്ന ആത്മാക്കൾക്ക് ശരണവും രക്ഷയും നീ ഉണ്ടാക്കേണമേ. നിന്നെ പ്രസവിച്ച മറിയാമിന്റെയും നിന്റെ സകല പരിശുദ്ധന്മാരുടെയും പ്രാർത്ഥനയാൽ ദൈവമേ ഞങ്ങളുടെ കടങ്ങൾക്ക് പരിഹാരമുണ്ടാക്കി ഞങ്ങളോട് കരുണ ചെയ്യേണമേ."]},
  {en:"Explain: “Grant us a peaceful evening and a sinless night.”", ml:"“സമാധാനം നിറഞ്ഞ സന്ധ്യയും പുണ്യമുള്ള രാവും” – വിശദീകരിക്കുക.",
   aen:["A peaceful evening and a holy night are essential for our physical and mental health. A peaceful night gives us an energetic day. Both are gifts of God, so we pray for them. God is called the ‘glorious King’ who always cares for His people."],
   aml:["മനുഷ്യന്റെ ശാരീരിക-മാനസിക ആരോഗ്യത്തിന് സമാധാനമുള്ള സന്ധ്യയും പുണ്യമുള്ള രാത്രിയും ആവശ്യമാണ്. ശാന്തമായ രാത്രി ഉന്മേഷമുള്ള പകലിന് സഹായിക്കുന്നു. ഇവ ദൈവദാനമാണ്; അതിനാൽ നാം അവയ്ക്കായി പ്രാർത്ഥിക്കുന്നു. പ്രജകളുടെ ക്ഷേമം നോക്കുന്ന ‘മഹത്വത്തിന്റെ രാജാവ്’ ആയി ദൈവത്തെ വിശേഷിപ്പിക്കുന്നു."]},
  {en:"Write what we learn from this prayer.", ml:"ഈ പ്രാർത്ഥനയിൽനിന്ന് നാം പഠിക്കുന്നത് എന്തെല്ലാം?",
   aen:["God dwells in a secret place beyond human understanding.","God gives us all we need and guides us even when we are not aware.","We need God’s mercy in this world and the world to come.","Jesus protects us under the wings of His mercy.","The Holy Cross is our weapon against the enemy and the sign of salvation."],
   aml:["മനുഷ്യചിന്തയ്ക്ക് അതീതമായ രഹസ്യസ്ഥാനത്താണ് ദൈവം വസിക്കുന്നത്.","നാം അറിയാതെ തന്നെ ദൈവം നമുക്കാവശ്യമുള്ളതെല്ലാം നൽകി നയിക്കുന്നു.","ഇഹലോകത്തിലും പരലോകത്തിലും നമുക്ക് ദൈവകരുണ ആവശ്യമാണ്.","കർത്താവ് തന്റെ കൃപയുടെ ചിറകിൻ മറവിൽ നമ്മെ സംരക്ഷിക്കുന്നു.","വി. സ്ലീബാ ശത്രുവിനെതിരെയുള്ള ആയുധവും രക്ഷയുടെ അടയാളവുമാണ്."]},
  {en:"Resolution of this chapter", ml:"ഈ പാഠത്തിലെ നിശ്ചയം",
   aen:["We will say the prayer “O Lord, who sittest in the secret place…” regularly with our evening prayer and meditate on it."],
   aml:["മഹോന്നതന്റെ മറവിൽ… എന്ന പ്രാർത്ഥന പതിവായി ഞങ്ങൾ സന്ധ്യാനമസ്കാരത്തോടൊപ്പം എന്നും പ്രാർത്ഥിക്കും."]}
 ]
}
];

/* ---------- HELPERS ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const bi = (en, ml, tag="span") => `<${tag} class="en">${esc(en)}</${tag}>${ml ? `<${tag} class="ml">${esc(ml)}</${tag}>` : ""}`;
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};

/* ---------- LANGUAGE ---------- */
function setLang(l){
  document.body.dataset.lang = l;
  document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === l));
  store.set("c7lang", l);
}
document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));

/* ---------- TABS ---------- */
const TABS = [...CH.map(c => ({id:c.id, label:`Chapter ${c.n}`, sub:c.ml})), {id:"test", label:"Mixed Test", sub:"20 questions · മിശ്ര പരീക്ഷ"}];
function renderTabs(active){
  $("#tabs").innerHTML = TABS.map(t => `<a class="tab" role="tab" href="#${t.id}" aria-selected="${t.id === active}" data-id="${t.id}">${esc(t.label)}<small class="ml-small">${esc(t.sub)}</small></a>`).join("");
}

/* ---------- MCQ ---------- */
function mcqHTML(q, idx, key){
  const order = shuffle([0,1,2,3]);
  return `<li class="q" data-key="${key}" data-correct="${q[3]}">
    <span class="n">${idx}.</span>
    <div class="body">
      <div class="qtext">${bi(q[0], q[1])}</div>
      <div class="opts">${order.map(i => `<button type="button" class="opt" data-i="${i}">${bi(q[2][i][0], q[2][i][1])}</button>`).join("")}</div>
      <div class="fb" hidden></div>
    </div>
  </li>`;
}
function answerMCQ(li, btn, q, onDone){
  const correct = +li.dataset.correct, pick = +btn.dataset.i, ok = pick === correct;
  li.querySelectorAll(".opt").forEach(b => {
    b.disabled = true;
    const i = +b.dataset.i;
    if (i === correct) b.classList.add("correct");
    else if (i === pick) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  const fb = li.querySelector(".fb");
  const right = q[2][correct];
  fb.innerHTML = ok
    ? `<b class="ok">${bi("Correct!", "ശരിയാണ്!")}</b> ${q[4] ? bi(q[4], q[5]) : ""}`
    : `<b class="bad">${bi("Not quite.", "തെറ്റി.")}</b> ${bi("Answer: " + right[0], "ഉത്തരം: " + right[1])} ${q[4] ? bi(q[4], q[5]) : ""}`;
  fb.hidden = false;
  onDone && onDone(ok, pick);
}

/* ---------- CHAPTER VIEW ---------- */
function renderChapter(c){
  const saved = store.get("c7-" + c.id, {});
  const v = $("#view");
  v.innerHTML = `
    <div class="chap-head">
      <div class="num">${bi("Chapter " + c.n, "പാഠം " + c.n)}</div>
      <h2><span class="en">${esc(c.en)}</span><span class="ml">${esc(c.ml)}</span></h2>
    </div>
    <div class="verse">
      <div class="lbl">${bi("Verse to be memorized", " · മനഃപാഠവാക്യം")}</div>
      <q class="en">${esc(c.verse.en)}</q>
      <q class="ml">${esc(c.verse.ml)}</q>
      <cite>${esc(c.verse.ref)}</cite>
    </div>
    <section style="display:flex;flex-direction:column;gap:14px">
      <div class="sec-title">
        <h3><span class="en">Choose the correct answer</span><span class="ml">ശരിയുത്തരം തിരഞ്ഞെടുക്കുക</span></h3>
        <span class="score" id="score"></span>
      </div>
      <ol class="qlist">${c.mcq.map((q, i) => mcqHTML(q, i + 1, i)).join("")}</ol>
      <div class="btnrow"><button type="button" class="btn ghost" id="reset">${bi("Start again", " · വീണ്ടും തുടങ്ങുക")}</button></div>
    </section>
    <section style="display:flex;flex-direction:column;gap:14px">
      <div class="sec-title">
        <h3><span class="en">Answer these questions</span><span class="ml">ഉത്തരം എഴുതുക</span></h3>
        <span class="score">${bi("Think first, then check", "ആലോചിച്ചശേഷം നോക്കുക")}</span>
      </div>
      <div class="cards">${c.short.map((s, i) => `
        <div class="card">
          <div class="qtext">${bi(s.en, s.ml)}</div>
          <button type="button" class="reveal" aria-expanded="false" data-i="${i}">${bi("Show answer", " · ഉത്തരം കാണുക")}</button>
          <div class="ans" hidden>
            ${s.aen.length > 1 ? `<ol class="en">${s.aen.map(a => `<li>${esc(a)}</li>`).join("")}</ol>` : `<p class="en" style="margin:0">${esc(s.aen[0])}</p>`}
            ${s.aml.length > 1 ? `<ol class="ml">${s.aml.map(a => `<li>${esc(a)}</li>`).join("")}</ol>` : `<p class="ml" style="margin:8px 0 0">${esc(s.aml[0])}</p>`}
          </div>
        </div>`).join("")}
      </div>
    </section>`;

  const total = c.mcq.length;
  const upd = () => {
    const vals = Object.values(saved);
    const right = vals.filter(x => x.ok).length;
    $("#score").innerHTML = `<b>${right}</b> ${bi("correct", "ശരി")} · ${vals.length}/${total} ${bi("answered", "ചെയ്തു")}`;
  };
  v.querySelectorAll(".q").forEach(li => {
    const k = li.dataset.key, q = c.mcq[k];
    if (saved[k]) {
      const btn = li.querySelector(`.opt[data-i="${saved[k].pick}"]`);
      answerMCQ(li, btn, q);
    }
    li.querySelectorAll(".opt").forEach(btn => btn.addEventListener("click", () => {
      answerMCQ(li, btn, q, (ok, pick) => { saved[k] = {ok, pick}; store.set("c7-" + c.id, saved); upd(); });
    }));
  });
  $("#reset").addEventListener("click", () => { store.set("c7-" + c.id, {}); renderChapter(c); });
  v.querySelectorAll(".reveal").forEach(b => b.addEventListener("click", () => {
    const a = b.nextElementSibling, open = a.hidden;
    a.hidden = !open; b.setAttribute("aria-expanded", open);
    b.innerHTML = open ? bi("Hide answer", " · ഉത്തരം മറയ്ക്കുക") : bi("Show answer", " · ഉത്തരം കാണുക");
  }));
  upd();
}

/* ---------- TEST VIEW ---------- */
function renderTestIntro(){
  const best = store.get("c7-best", null);
  $("#view").innerHTML = `
    <div class="chap-head">
      <div class="num">${bi("Chapters 9–13", "പാഠം 9–13")}</div>
      <h2><span class="en">Mixed Revision Test</span><span class="ml">മിശ്ര പുനരവലോകന പരീക്ഷ</span></h2>
    </div>
    <div class="test-intro">
      <p>${bi("20 questions picked at random from all five chapters, one at a time. Your score is shown at the end, with every question you missed.", "അഞ്ച് പാഠങ്ങളിൽ നിന്നും 20 ചോദ്യങ്ങൾ, ഓരോന്നായി. അവസാനം മാർക്കും തെറ്റിയ ചോദ്യങ്ങളും കാണാം.")}</p>
      ${best !== null ? `<p class="score">${bi("Your best score on this device:", "ഈ ഫോണിലെ മികച്ച മാർക്ക്:")} <b>${best}/20</b></p>` : ""}
      <div class="btnrow"><button type="button" class="btn" id="start">${bi("Start test", " · പരീക്ഷ തുടങ്ങുക")}</button></div>
    </div>`;
  $("#start").addEventListener("click", startTest);
}
function startTest(){
  const pool = [];
  CH.forEach(c => c.mcq.forEach(q => pool.push({q, ch:c.n})));
  const qs = shuffle(pool).slice(0, 20);
  let i = 0, score = 0; const missed = [];
  const step = () => {
    if (i >= qs.length) return finish();
    const {q, ch} = qs[i];
    $("#view").innerHTML = `
      <div style="display:flex;flex-direction:column;gap:8px">
        <div class="test-meta"><span>${bi("Question " + (i + 1) + " of 20", " · ചോദ്യം " + (i + 1) + "/20")}</span><span>${bi("Score " + score, " · മാർക്ക് " + score)}</span></div>
        <div class="bar"><i style="width:${i / qs.length * 100}%"></i></div>
      </div>
      <ol class="qlist"><li class="q" data-correct="${q[3]}"><span class="n"><span class="chip">${bi("Ch " + ch, " · പാഠം " + ch)}</span></span>
        <div class="body">
          <div class="qtext">${bi(q[0], q[1])}</div>
          <div class="opts">${shuffle([0,1,2,3]).map(k => `<button type="button" class="opt" data-i="${k}">${bi(q[2][k][0], q[2][k][1])}</button>`).join("")}</div>
          <div class="fb" hidden></div>
        </div></li></ol>
      <div class="btnrow"><button type="button" class="btn" id="next" hidden>${i === qs.length - 1 ? bi("See my score", " · മാർക്ക് കാണുക") : bi("Next question", " · അടുത്ത ചോദ്യം")}</button></div>`;
    const li = $("#view .q");
    li.querySelectorAll(".opt").forEach(btn => btn.addEventListener("click", () => {
      answerMCQ(li, btn, q, ok => { if (ok) score++; else missed.push({q, ch}); $("#next").hidden = false; $("#next").focus(); });
    }));
    $("#next").addEventListener("click", () => { i++; step(); window.scrollTo({top:0}); });
  };
  const finish = () => {
    const best = store.get("c7-best", 0);
    if (score > best) store.set("c7-best", score);
    const msg = score >= 18 ? ["Excellent! Well prepared.", "മികച്ചത്! നന്നായി പഠിച്ചിട്ടുണ്ട്."]
              : score >= 14 ? ["Good work. Revise the ones you missed.", "നല്ലത്. തെറ്റിയവ ഒന്നുകൂടി പഠിക്കുക."]
              : ["Keep practising. Go through each chapter again.", "ഓരോ പാഠവും ഒന്നുകൂടി വായിച്ച് പരിശീലിക്കുക."];
    $("#view").innerHTML = `
      <div class="result">
        <span class="chip">${bi("Your score", " · നിങ്ങളുടെ മാർക്ക്")}</span>
        <div class="big">${score}<small>/20</small></div>
        <p style="margin:0">${bi(msg[0], msg[1])}</p>
        <div class="btnrow" style="justify-content:center;margin-top:8px">
          <button type="button" class="btn" id="again">${bi("Try another test", " · വീണ്ടും എഴുതുക")}</button>
        </div>
      </div>
      ${missed.length ? `<section style="display:flex;flex-direction:column;gap:12px">
        <div class="sec-title"><h3><span class="en">Questions to revise</span><span class="ml">വീണ്ടും പഠിക്കേണ്ടവ</span></h3></div>
        <div class="cards">${missed.map(m => `<div class="card">
          <span class="chip" style="align-self:flex-start">${bi("Chapter " + m.ch, " · പാഠം " + m.ch)}</span>
          <div class="qtext">${bi(m.q[0], m.q[1])}</div>
          <div class="ans">${bi("Answer: " + m.q[2][m.q[3]][0], "ഉത്തരം: " + m.q[2][m.q[3]][1], "div")}</div>
        </div>`).join("")}</div></section>` : ""}`;
    $("#again").addEventListener("click", startTest);
  };
  step();
}

/* ---------- ROUTING ---------- */
function route(){
  const id = (location.hash || "#ch9").slice(1);
  const c = CH.find(x => x.id === id);
  renderTabs(c ? c.id : "test");
  if (c) renderChapter(c); else renderTestIntro();
}
document.addEventListener("click", e => {
  const t = e.target.closest(".tab");
  if (!t) return;
  e.preventDefault();
  try { history.replaceState(null, "", "#" + t.dataset.id); } catch(err) {}
  const c = CH.find(x => x.id === t.dataset.id);
  renderTabs(t.dataset.id);
  if (c) renderChapter(c); else renderTestIntro();
  window.scrollTo({top:0});
});
window.addEventListener("hashchange", route);
setLang(store.get("c7lang", "both"));
route();
</script>
