const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
const TEST_N = 20;
const RANGE = `${CH[0].n}–${CH[CH.length - 1].n}`;
const BEST_KEY = "c7-best-" + RANGE;

/* ---------- LANGUAGE ---------- */
function setLang(l){
  document.body.dataset.lang = l;
  document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === l));
  store.set("c7lang", l);
}
document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));

/* ---------- TABS ---------- */
const TABS = [{id:"home", label:"All chapters", sub:"പാഠങ്ങൾ"}, ...CH.map(c => ({id:c.id, label:`Chapter ${c.n}`, sub:c.ml})), {id:"test", label:"Mixed Test", sub:"മിശ്ര പരീക്ഷ"}];
function renderTabs(active){
  $("#tabs").innerHTML = TABS.map(t => `<a class="tab" role="tab" href="#${t.id}" aria-selected="${t.id === active}" data-id="${t.id}">${esc(t.label)}<small>${esc(t.sub)}</small></a>`).join("");
}

/* ---------- MCQ ---------- */
function mcqHTML(q, idx, key){
  const order = shuffle([0,1,2,3]);
  return `<li class="q" data-key="${key}" data-correct="${q[3]}">
    <span class="n">${idx}.</span>
    <div class="body">
      <div class="qtext">${bi(q[0], q[1])}</div>
      <div class="opts">${order.map(i => `<button type="button" class="opt" data-i="${i}">${bi(q[2][i][0], q[2][i][1])}</button>`).join("")}</div>
      <div class="fb" hidden></div>
    </div>
  </li>`;
}
function answerMCQ(li, btn, q, onDone){
  const correct = +li.dataset.correct, pick = +btn.dataset.i, ok = pick === correct;
  li.querySelectorAll(".opt").forEach(b => {
    b.disabled = true;
    const i = +b.dataset.i;
    if (i === correct) b.classList.add("correct");
    else if (i === pick) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  const fb = li.querySelector(".fb");
  const right = q[2][correct];
  fb.innerHTML = ok
    ? `<b class="ok">${bi("Correct!", "ശരിയാണ്!")}</b> ${q[4] ? bi(q[4], q[5]) : ""}`
    : `<b class="bad">${bi("Not quite.", "തെറ്റി.")}</b> ${bi("Answer: " + right[0], "ഉത്തരം: " + right[1])} ${q[4] ? bi(q[4], q[5]) : ""}`;
  fb.hidden = false;
  onDone && onDone(ok, pick);
}

/* ---------- CHAPTER VIEW ---------- */
function renderChapter(c){
  const saved = store.get("c7-" + c.id, {});
  const v = $("#view");
  v.innerHTML = `
    <div class="chap-head">
      <div class="num">${bi("Chapter " + c.n, "പാഠം " + c.n)}</div>
      <h2><span class="en">${esc(c.en)}</span><span class="ml">${esc(c.ml)}</span></h2>
    </div>
    <div class="verse">
      <div class="lbl">${bi("Verse to be memorized", " · മനഃപാഠവാക്യം")}</div>
      <q class="en">${esc(c.verse.en)}</q>
      <q class="ml">${esc(c.verse.ml)}</q>
      <cite>${esc(c.verse.ref)}</cite>
    </div>
    <section style="display:flex;flex-direction:column;gap:14px">
      <div class="sec-title">
        <h3><span class="en">Choose the correct answer</span><span class="ml">ശരിയുത്തരം തിരഞ്ഞെടുക്കുക</span></h3>
        <span class="score" id="score"></span>
      </div>
      <ol class="qlist">${c.mcq.map((q, i) => mcqHTML(q, i + 1, i)).join("")}</ol>
      <div class="btnrow"><button type="button" class="btn ghost" id="reset">${bi("Start again", " · വീണ്ടും തുടങ്ങുക")}</button></div>
    </section>
    <section style="display:flex;flex-direction:column;gap:14px">
      <div class="sec-title">
        <h3><span class="en">Answer these questions</span><span class="ml">ഉത്തരം എഴുതുക</span></h3>
        <span class="score">${bi("Think first, then check", "ആലോചിച്ചശേഷം നോക്കുക")}</span>
      </div>
      <div class="cards">${c.short.map((s, i) => `
        <div class="card">
          <div class="qtext">${bi(s.en, s.ml)}</div>
          <button type="button" class="reveal" aria-expanded="false" data-i="${i}">${bi("Show answer", " · ഉത്തരം കാണുക")}</button>
          <div class="ans" hidden>
            ${s.aen.length > 1 ? `<ol class="en">${s.aen.map(a => `<li>${esc(a)}</li>`).join("")}</ol>` : `<p class="en" style="margin:0">${esc(s.aen[0])}</p>`}
            ${s.aml.length > 1 ? `<ol class="ml">${s.aml.map(a => `<li>${esc(a)}</li>`).join("")}</ol>` : `<p class="ml" style="margin:8px 0 0">${esc(s.aml[0])}</p>`}
          </div>
        </div>`).join("")}
      </div>
    </section>`;

  const total = c.mcq.length;
  const upd = () => {
    const vals = Object.values(saved);
    const right = vals.filter(x => x.ok).length;
    $("#score").innerHTML = `<b>${right}</b> ${bi("correct", "ശരി")} · ${vals.length}/${total} ${bi("answered", "ചെയ്തു")}`;
  };
  v.querySelectorAll(".q").forEach(li => {
    const k = li.dataset.key, q = c.mcq[k];
    if (saved[k]) {
      const btn = li.querySelector(`.opt[data-i="${saved[k].pick}"]`);
      answerMCQ(li, btn, q);
    }
    li.querySelectorAll(".opt").forEach(btn => btn.addEventListener("click", () => {
      answerMCQ(li, btn, q, (ok, pick) => { saved[k] = {ok, pick}; store.set("c7-" + c.id, saved); upd(); });
    }));
  });
  $("#reset").addEventListener("click", () => { store.set("c7-" + c.id, {}); renderChapter(c); });
  v.querySelectorAll(".reveal").forEach(b => b.addEventListener("click", () => {
    const a = b.nextElementSibling, open = a.hidden;
    a.hidden = !open; b.setAttribute("aria-expanded", open);
    b.innerHTML = open ? bi("Hide answer", " · ഉത്തരം മറയ്ക്കുക") : bi("Show answer", " · ഉത്തരം കാണുക");
  }));
  upd();
}

/* ---------- HOME VIEW (chapter picker) ---------- */
function renderHome(){
  $("#view").innerHTML = `
    <div class="chap-head">
      <div class="num">${bi("Choose a chapter", "പാഠം തിരഞ്ഞെടുക്കുക")}</div>
      <h2><span class="en">What do you want to practise?</span><span class="ml">ഏത് പാഠമാണ് പരിശീലിക്കേണ്ടത്?</span></h2>
    </div>
    <div class="pick">
      ${CH.map(c => {
        const done = Object.values(store.get("c7-" + c.id, {}));
        const right = done.filter(x => x.ok).length;
        return `<a class="chcard" href="#${c.id}" data-go="${c.id}">
          <span class="num">${bi("Chapter " + c.n, " · പാഠം " + c.n)}</span>
          <span class="t"><span class="en">${esc(c.en)}</span><span class="ml">${esc(c.ml)}</span></span>
          <span class="meta">${done.length
            ? `<b>${right}</b> ${bi("correct", "ശരി")} · ${done.length}/${c.mcq.length} ${bi("answered", "ചെയ്തു")}`
            : bi(`${c.mcq.length} questions · ${c.short.length} answer cards`, ` · ${c.mcq.length} ചോദ്യങ്ങൾ`)}</span>
        </a>`;
      }).join("")}
      <a class="chcard test" href="#test" data-go="test">
        <span class="num">${bi("Test yourself", " · സ്വയം പരീക്ഷിക്കുക")}</span>
        <span class="t"><span class="en">Mixed Revision Test</span><span class="ml">മിശ്ര പുനരവലോകന പരീക്ഷ</span></span>
        <span class="meta">${bi("Pick the chapters you want", "പാഠങ്ങൾ തിരഞ്ഞെടുക്കാം")}</span>
      </a>
    </div>`;
}

/* ---------- TEST VIEW ---------- */
function renderTestIntro(){
  const best = store.get(BEST_KEY, null);
  const sel = new Set(store.get("c7-test-ch", CH.map(c => c.n)).filter(n => CH.some(c => c.n === n)));
  if (!sel.size) CH.forEach(c => sel.add(c.n));
  $("#view").innerHTML = `
    <div class="chap-head">
      <div class="num">${bi("Chapters " + RANGE, "പാഠം " + RANGE)}</div>
      <h2><span class="en">Mixed Revision Test</span><span class="ml">മിശ്ര പുനരവലോകന പരീക്ഷ</span></h2>
    </div>
    <div class="test-intro">
      <p>${bi(`Up to ${TEST_N} questions picked at random from the chapters you choose, one at a time. Your score is shown at the end, with every question you missed.`, `തിരഞ്ഞെടുക്കുന്ന പാഠങ്ങളിൽ നിന്ന് ${TEST_N} ചോദ്യങ്ങൾ വരെ, ഓരോന്നായി. അവസാനം മാർക്കും തെറ്റിയ ചോദ്യങ്ങളും കാണാം.`)}</p>
      <div style="display:flex;flex-direction:column;gap:8px">
        <b>${bi("Chapters in this test", " · ഈ പരീക്ഷയിലെ പാഠങ്ങൾ")}</b>
        <div class="toggles" role="group">${CH.map(c => `<button type="button" data-n="${c.n}" aria-pressed="${sel.has(c.n)}">${bi("Ch " + c.n, " · പാഠം " + c.n)}</button>`).join("")}</div>
      </div>
      ${best !== null ? `<p class="score">${bi("Your best score on this device:", "ഈ ഫോണിലെ മികച്ച മാർക്ക്:")} <b>${best}/${TEST_N}</b></p>` : ""}
      <div class="btnrow"><button type="button" class="btn" id="start">${bi("Start test", " · പരീക്ഷ തുടങ്ങുക")}</button></div>
    </div>`;
  $("#view").querySelectorAll(".toggles button").forEach(b => b.addEventListener("click", () => {
    const n = +b.dataset.n;
    if (sel.has(n)) { if (sel.size > 1) sel.delete(n); } else sel.add(n);
    $("#view").querySelectorAll(".toggles button").forEach(x => x.setAttribute("aria-pressed", sel.has(+x.dataset.n)));
    store.set("c7-test-ch", [...sel]);
  }));
  $("#start").addEventListener("click", () => startTest([...sel]));
}
function startTest(chs){
  const pool = [];
  CH.filter(c => chs.includes(c.n)).forEach(c => c.mcq.forEach(q => pool.push({q, ch:c.n})));
  const qs = shuffle(pool).slice(0, TEST_N);
  let i = 0, score = 0; const missed = [];
  const step = () => {
    if (i >= qs.length) return finish();
    const {q, ch} = qs[i];
    $("#view").innerHTML = `
      <div style="display:flex;flex-direction:column;gap:8px">
        <div class="test-meta"><span>${bi("Question " + (i + 1) + " of " + qs.length, " · ചോദ്യം " + (i + 1) + "/" + qs.length)}</span><span>${bi("Score " + score, " · മാർക്ക് " + score)}</span></div>
        <div class="bar"><i style="width:${i / qs.length * 100}%"></i></div>
      </div>
      <ol class="qlist"><li class="q" data-correct="${q[3]}"><span class="n"><span class="chip">${bi("Ch " + ch, " · പാഠം " + ch)}</span></span>
        <div class="body">
          <div class="qtext">${bi(q[0], q[1])}</div>
          <div class="opts">${shuffle([0,1,2,3]).map(k => `<button type="button" class="opt" data-i="${k}">${bi(q[2][k][0], q[2][k][1])}</button>`).join("")}</div>
          <div class="fb" hidden></div>
        </div></li></ol>
      <div class="btnrow"><button type="button" class="btn" id="next" hidden>${i === qs.length - 1 ? bi("See my score", " · മാർക്ക് കാണുക") : bi("Next question", " · അടുത്ത ചോദ്യം")}</button></div>`;
    const li = $("#view .q");
    li.querySelectorAll(".opt").forEach(btn => btn.addEventListener("click", () => {
      answerMCQ(li, btn, q, ok => { if (ok) score++; else missed.push({q, ch}); $("#next").hidden = false; $("#next").focus(); });
    }));
    $("#next").addEventListener("click", () => { i++; step(); window.scrollTo({top:0}); });
  };
  const finish = () => {
    const n = qs.length;
    const best = store.get(BEST_KEY, 0);
    if (score > best) store.set(BEST_KEY, score);
    const msg = score >= n * 0.9 ? ["Excellent! Well prepared.", "മികച്ചത്! നന്നായി പഠിച്ചിട്ടുണ്ട്."]
              : score >= n * 0.7 ? ["Good work. Revise the ones you missed.", "നല്ലത്. തെറ്റിയവ ഒന്നുകൂടി പഠിക്കുക."]
              : ["Keep practising. Go through each chapter again.", "ഓരോ പാഠവും ഒന്നുകൂടി വായിച്ച് പരിശീലിക്കുക."];
    $("#view").innerHTML = `
      <div class="result">
        <span class="chip">${bi("Your score", " · നിങ്ങളുടെ മാർക്ക്")}</span>
        <div class="big">${score}<small>/${n}</small></div>
        <p style="margin:0">${bi(msg[0], msg[1])}</p>
        <div class="btnrow" style="justify-content:center;margin-top:8px">
          <button type="button" class="btn" id="again">${bi("Try another test", " · വീണ്ടും എഴുതുക")}</button>
        </div>
      </div>
      ${missed.length ? `<section style="display:flex;flex-direction:column;gap:12px">
        <div class="sec-title"><h3><span class="en">Questions to revise</span><span class="ml">വീണ്ടും പഠിക്കേണ്ടവ</span></h3></div>
        <div class="cards">${missed.map(m => `<div class="card">
          <span class="chip" style="align-self:flex-start">${bi("Chapter " + m.ch, " · പാഠം " + m.ch)}</span>
          <div class="qtext">${bi(m.q[0], m.q[1])}</div>
          <div class="ans">${bi("Answer: " + m.q[2][m.q[3]][0], "ഉത്തരം: " + m.q[2][m.q[3]][1], "div")}</div>
        </div>`).join("")}</div></section>` : ""}`;
    $("#again").addEventListener("click", () => startTest(chs));
  };
  step();
}

/* ---------- ROUTING ---------- */
function show(id){
  const c = CH.find(x => x.id === id);
  if (!c && id !== "test") id = "home";
  renderTabs(id);
  if (c) renderChapter(c); else if (id === "test") renderTestIntro(); else renderHome();
  const tab = document.querySelector(`.tab[data-id="${id}"]`);
  tab && tab.scrollIntoView({block:"nearest", inline:"nearest"});
}
function route(){ show((location.hash || "#home").slice(1)); }
document.addEventListener("click", e => {
  const t = e.target.closest(".tab, .chcard");
  if (!t) return;
  e.preventDefault();
  const id = t.dataset.id || t.dataset.go;
  try { history.replaceState(null, "", "#" + id); } catch(err) {}
  show(id);
  window.scrollTo({top:0});
});
window.addEventListener("hashchange", route);
setLang(store.get("c7lang", "both"));
route();
</script>

</body>
</html>
