<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Class 7 Revision 20–25</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@600;800&family=Alegreya+Sans:wght@400;500;700&family=Noto+Sans+Malayalam:wght@400;600;700&display=swap">
<style>
/* Layout: one reading column; sticky chapter bar; questions as numbered practice items, then reveal-answer cards */
:root{
  --bg:#F5F3F7; --surface:#FFFFFF; --sunk:#ECE8F0; --ink:#1E1A29; --muted:#625B70; --line:#DCD6E3;
  --accent:#8A1C3B; --accent-ink:#FFFFFF; --accent-soft:#F6E4EA; --gold:#9A6E1C; --gold-soft:#F7EEDB;
  --ok:#1D7A4A; --ok-soft:#E1F3E8; --bad:#B4322C; --bad-soft:#FBE6E4;
  --f-display:"Alegreya", Georgia, serif;
  --f-body:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --f-ml:"Noto Sans Malayalam", "Manjari", "Kartika", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15111B; --surface:#201A28; --sunk:#2A2333; --ink:#EEE9F3; --muted:#A79FB4; --line:#3A3245;
  --accent:#E8789A; --accent-ink:#1A0D13; --accent-soft:#3A1C28; --gold:#E2B65A; --gold-soft:#352A16;
  --ok:#5BCB8C; --ok-soft:#173226; --bad:#F08079; --bad-soft:#3A1C1B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15111B; --surface:#201A28; --sunk:#2A2333; --ink:#EEE9F3; --muted:#A79FB4; --line:#3A3245;
  --accent:#E8789A; --accent-ink:#1A0D13; --accent-soft:#3A1C28; --gold:#E2B65A; --gold-soft:#352A16;
  --ok:#5BCB8C; --ok-soft:#173226; --bad:#F08079; --bad-soft:#3A1C1B; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.ml{font-family:var(--f-ml);line-height:1.7}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{padding-block:22px 16px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between}
.brand .eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);font-weight:700}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,5vw,34px);line-height:1.1;margin:4px 0 2px;text-wrap:balance}
.brand p{margin:0;color:var(--muted);font-size:15px}

.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);font:600 14px var(--f-body);padding:7px 13px;border-radius:999px;cursor:pointer}
.seg button.ml{font-family:var(--f-ml);font-size:13px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:6px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
nav.tabs .wrap::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:8px 14px;font:600 15px var(--f-body);cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:0;text-decoration:none}
.tab small{font-weight:500;color:var(--muted);font-size:12px}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tab[aria-selected="true"] small{color:var(--accent-ink);opacity:.85}

main .wrap{padding-block:26px 64px;display:flex;flex-direction:column;gap:28px}
.chap-head .num{font:700 13px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.chap-head h2{font-family:var(--f-display);font-size:clamp(24px,4.5vw,30px);line-height:1.15;margin:4px 0 0;text-wrap:balance}
.chap-head h2 .ml{display:block;font-size:.78em;font-weight:700;margin-top:4px;color:var(--muted)}

.verse{background:var(--gold-soft);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.verse .lbl{font-size:12px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--gold)}
.verse q{quotes:none;font-family:var(--f-display);font-size:19px;font-weight:600;line-height:1.4}
.verse .ml{font-size:16px}
.verse cite{font-style:normal;color:var(--muted);font-size:14px}

.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:6px}
.sec-title h3{margin:0;font-family:var(--f-display);font-size:21px}
.sec-title h3 .ml{font-size:15px;font-weight:600;color:var(--muted);margin-left:6px}
.score{font-variant-numeric:tabular-nums;font-size:15px;color:var(--muted)}
.score b{color:var(--ink)}

.qlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.q .n{font:700 15px var(--f-body);color:var(--accent);font-variant-numeric:tabular-nums;padding-top:1px;min-width:1.6em}
.q .body{min-width:0;display:flex;flex-direction:column;gap:10px}
.qtext{font-weight:700;font-size:17px}
.qtext .ml{display:block;font-weight:600;font-size:15.5px;color:var(--ink)}
.qtext .en + .ml{margin-top:2px;color:var(--muted)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:560px){.opts{grid-template-columns:1fr}}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:9px 12px;cursor:pointer;font:500 16px var(--f-body);display:flex;flex-direction:column;gap:1px;min-width:0}
.opt .ml{font-size:14.5px;color:var(--muted)}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:focus-visible,.tab:focus-visible,.seg button:focus-visible,.btn:focus-visible,.reveal:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .ml{color:var(--ink)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .ml{color:var(--ink)}
.opt.dim{opacity:.55}
.fb{font-size:15px;border-radius:10px;padding:9px 12px;background:var(--sunk)}
.fb b.ok{color:var(--ok)} .fb b.bad{color:var(--bad)}
.fb .ml{display:block;font-size:14px}

.cards{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.reveal{align-self:flex-start;border:1.5px solid var(--accent);color:var(--accent);background:transparent;border-radius:999px;padding:6px 14px;font:700 14px var(--f-body);cursor:pointer}
.reveal .ml{font-weight:600;font-size:13px}
.ans{background:var(--accent-soft);border-radius:10px;padding:12px 14px;font-size:16px}
.ans ol,.ans ul{margin:0;padding-left:1.3em}
.ans .ml{margin-top:8px;font-size:15px}
.ans .ml:first-child{margin-top:0}

.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:11px 18px;font:700 16px var(--f-body);cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}

/* Test mode */
.test-intro{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:14px}
.test-intro p{margin:0}
.bar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.test-meta{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.result{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.result .big{font-family:var(--f-display);font-size:56px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.result .big small{font-size:24px;color:var(--muted)}
.chip{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--muted)}

body[data-lang="en"] .ml{display:none!important}
body[data-lang="ml"] .en{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
footer{color:var(--muted);font-size:13px;text-align:center;padding-block:0 32px}
html{color-scheme:light}body{margin:0}[hidden]{display:none!important}img{max-width:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>

   "It is observed 18 days before the Great Lent.","വലിയ നോമ്പിന് 18 ദിവസം മുമ്പ് ആചരിക്കുന്നു."],
  ["When is Wednesday/Friday fasting NOT required?","ബുധൻ/വെള്ളി ഉപവാസം നിർബന്ധമില്ലാത്ത ദിവസങ്ങൾ?",
   [["The 18 days between the Three-day Fast and Lent, and the 50 days after Easter","മൂന്നുനോമ്പിനും വലിയ നോമ്പിനും ഇടയിലെ 18 ദിവസവും ഉയിർപ്പ് മുതൽ പെന്തിക്കോസ്തി വരെ 50 ദിവസവും"],["All of December","ഡിസംബർ മുഴുവൻ"],["During school exams","സ്കൂൾ പരീക്ഷാസമയത്ത്"],["Every Wednesday","എല്ലാ ബുധനാഴ്ചയും"]],0,"",""],
  ["Which Old Testament figures fasted before important events?","പ്രധാന സംഭവങ്ങൾക്കു മുമ്പ് ഉപവസിച്ച പഴയനിയമ വ്യക്തികൾ?",
   [["Moses (before the Commandments) and Elijah (before ascending)","മോശ (കല്പനകൾക്കു മുമ്പ്), ഏലിയാവ് (സ്വർഗ്ഗാരോഹണത്തിനു മുമ്പ്)"],["Cain and Abel","കയീനും ഹാബേലും"],["Saul and Goliath","ശൗലും ഗോല്യാത്തും"],["Absalom and Joab","അബ്ശാലോമും യോവാബും"]],0,"",""],
  ["Fasting is meaningless for those who…","ആരുടെ നോമ്പ് വ്യർത്ഥമാണ്?",
   [["Do not share their bread with the poor","വിശക്കുന്നവർക്ക് ഭക്ഷണം പങ്കുവയ്ക്കാത്തവരുടെ"],["Pray too much","കൂടുതൽ പ്രാർത്ഥിക്കുന്നവരുടെ"],["Go to church","പള്ളിയിൽ പോകുന്നവരുടെ"],["Read the Bible","ബൈബിൾ വായിക്കുന്നവരുടെ"]],0,"",""],
  ["The memory verse of this chapter is from…","ഈ പാഠത്തിലെ മനഃപാഠവാക്യം ഏത് ഭാഗത്തുനിന്ന്?",
   [["Isaiah 58:6","യെശയ്യാവ് 58:6"],["Matthew 17:21","മത്തായി 17:21"],["Matthew 9:37","മത്തായി 9:37"],["Psalm 119:164","സങ്കീ. 119:164"]],0,"",""]
 ],
 short:[
  {en:"What are the benefits of fasting?", ml:"നോമ്പും ഉപവാസവും കൊണ്ടുള്ള പ്രയോജനങ്ങൾ?",
   aen:["It nourishes the soul and helps us control the desires of our five senses.","Controlling the strong urge for food gives strength to control other impulses.","We give more time to prayer, Bible reading, meditation and good deeds, and are freed from evil thoughts.","It helps regain physical and spiritual health and protects against lifestyle diseases.","It helps us overcome Satan and draws us close to God."],
   aml:["ആത്മാവിനെ വളർത്തുന്നു; പഞ്ചേന്ദ്രിയങ്ങളുടെ ആഗ്രഹങ്ങളെ നിയന്ത്രിക്കാൻ സഹായിക്കുന്നു.","ഭക്ഷണത്തോടുള്ള ആഗ്രഹം നിയന്ത്രിച്ചാൽ മറ്റ് വികാരങ്ങളെയും നിയന്ത്രിക്കാൻ ശക്തി ലഭിക്കുന്നു.","പ്രാർത്ഥന, വേദവായന, ധ്യാനം, പുണ്യപ്രവൃത്തികൾ എന്നിവയ്ക്ക് കൂടുതൽ സമയം; ദുർചിന്തകളിൽനിന്ന് മോചനം.","ശാരീരിക-ആത്മീയ ആരോഗ്യം വീണ്ടെടുക്കാൻ സഹായിക്കുന്നു.","സാത്താനെ ജയിക്കാനും ദൈവത്തോട് അടുക്കാനും സഹായിക്കുന്നു."]},
  {en:"Name the five Canonical Fasts of the Church and when they are observed.", ml:"സഭയുടെ അഞ്ച് കാനോനിക നോമ്പുകളും അവയുടെ സമയവും എഴുതുക.",
   aen:["Great Lent – 50 days (usually February–April)","Fast of the Apostles – June 16 to 29","Fast of the Mother of God (Shoonoyo) – August 1 to 15","Fast of Yeldho (Nativity) – December 1 to 25","Three-day Fast (Nineveh) – 18 days before the Great Lent"],
   aml:["വലിയ നോമ്പ് – 50 ദിവസം (സാധാരണ ഫെബ്രുവരി–ഏപ്രിൽ)","ശ്ലീഹാ നോമ്പ് – ജൂൺ 16 മുതൽ 29 വരെ","ദൈവമാതാവിന്റെ നോമ്പ് (ശൂനോയോ) – ആഗസ്റ്റ് 1 മുതൽ 15 വരെ","യൽദോ നോമ്പ് – ഡിസംബർ 1 മുതൽ 25 വരെ","മൂന്നു നോമ്പ് (നിനെവേ) – വലിയ നോമ്പിന് 18 ദിവസം മുമ്പ്"]},
  {en:"How should we observe fasts?", ml:"നോമ്പുകൾ എങ്ങനെ ആചരിക്കണം?",
   aen:["With repentance and confession.","By being reconciled to our brothers and sisters.","By helping those who suffer in society and sharing our bread with the needy (Isaiah 58:6-7).","Fasting is not only avoiding food – it must be joined with prayer and charity, and never done to show off (Matthew 6:16)."],
   aml:["അനുതാപത്തോടും കുമ്പസാരത്തോടും കൂടെ.","സഹോദരങ്ങളുമായി അനുരഞ്ജനപ്പെട്ട്.","സമൂഹത്തിൽ ദുഃഖിക്കുന്നവരെ സഹായിച്ചും വിശക്കുന്നവർക്ക് ഭക്ഷണം പങ്കുവച്ചും (യെശ. 58:6-7).","നോമ്പ് ഭക്ഷണം വർജ്ജിക്കൽ മാത്രമല്ല; പ്രാർത്ഥനയിലും ദാനധർമ്മത്തിലും വ്യാപരിക്കണം; പ്രദർശനത്തിനായി ആകരുത് (മത്താ. 6:16)."]},
  {en:"Resolution of this chapter", ml:"ഈ പാഠത്തിലെ നിശ്ചയം",
   aen:["We will observe all Fasts faithfully and with devotion."],
   aml:["നോമ്പുകൾ കൃത്യമായി ഞാൻ അനുഷ്ഠിക്കും."]}
 ]
},
{
 id:"ch21", n:21, en:"Ascetic Life", ml:"സന്യാസ ജീവിതം",
 verse:{en:"“The harvest truly is plentiful, but the labourers are few. Therefore pray the Lord of the harvest to send out labourers into His harvest.”", ml:"“കൊയ്ത്ത് വളരെ ഉണ്ട് സത്യം, വേലക്കാരോ ചുരുക്കം; ആകയാൽ കൊയ്ത്തിന്റെ യജമാനനോട് കൊയ്ത്തിലേക്ക് വേലക്കാരെ അയയ്ക്കേണ്ടതിന് യാചിപ്പിൻ”", ref:"St. Matthew 9:37-38 · മത്തായി 9:37-38"},
 mcq:[
  ["According to Indian thought, what are the four stages of life?","ഭാരതീയ ചിന്തയിലെ ജീവിതത്തിന്റെ നാല് ഘട്ടങ്ങൾ?",
   [["Brahmacharya, Garhasthya, Vanaprastha, Sanyasa","ബ്രഹ്മചര്യം, ഗാർഹസ്ഥ്യം, വാനപ്രസ്ഥം, സന്യാസം"],["Childhood, youth, middle age, old age","ബാല്യം, യൗവനം, മദ്ധ്യവയസ്സ്, വാർദ്ധക്യം"],["Morning, noon, evening, night","രാവിലെ, ഉച്ച, വൈകിട്ട്, രാത്രി"],["Body, mind, soul, spirit","ശരീരം, മനസ്സ്, ആത്മാവ്, ചൈതന്യം"]],0,"",""],
  ["An ‘ascetic’ (sanyasi) is a person who…","‘സന്യാസി’ എന്നാൽ…",
   [["Has freed himself from all worldly bonds","ലോകബന്ധങ്ങളിൽനിന്ന് വിമുക്തനായവൻ"],["Rules a kingdom","രാജ്യം ഭരിക്കുന്നവൻ"],["Lives only for pleasure","സുഖത്തിനായി മാത്രം ജീവിക്കുന്നവൻ"],["Travels for business","വ്യാപാരത്തിനായി യാത്ര ചെയ്യുന്നവൻ"]],0,"",""],
  ["The place where monks live is called…","സന്യാസിമാർ താമസിക്കുന്ന സ്ഥലം?",
   [["Monastery (Dayara)","ദയറാ (ആശ്രമം)"],["Convent (Madom)","മഠം"],["Palace","കൊട്ടാരം"],["Synagogue","സിനഗോഗ്"]],0,
   "Female ascetics (nuns) live in a convent (മഠം).","സന്യാസിനിമാർ താമസിക്കുന്നത് മഠത്തിൽ."],
  ["What does the Orthodox Church say about ascetic life versus family life?","സന്യാസവും കുടുംബജീവിതവും സംബന്ധിച്ച് ഓർത്തഡോക്സ് സഭയുടെ നിലപാട്?",
   [["Neither is greater; each person freely chooses and must stay faithful","ഏതാണ് ശ്രേഷ്ഠമെന്ന തർക്കമില്ല; സ്വതന്ത്രമായി തിരഞ്ഞെടുത്ത് വിശ്വസ്തരായി ജീവിക്കണം"],["Ascetic life is the only right way","സന്യാസം മാത്രമാണ് ശരി"],["Family life is the only right way","കുടുംബജീവിതം മാത്രമാണ് ശരി"],["Parents must decide for their children","മാതാപിതാക്കൾ തീരുമാനിക്കണം"]],0,"",""],
  ["Who were the ‘Essenes’?","‘എസ്സീന്യർ’ ആരായിരുന്നു?",
   [["Jewish ascetics who lived by the Dead Sea (2nd century BC)","ചാവുകടൽ തീരത്ത് ജീവിച്ചിരുന്ന യഹൂദ സന്യാസികൾ (ബി.സി. 2-ാം നൂറ്റാണ്ട്)"],["Roman soldiers","റോമൻ പടയാളികൾ"],["Greek philosophers","ഗ്രീക്ക് തത്വചിന്തകർ"],["Indian kings","ഇന്ത്യൻ രാജാക്കന്മാർ"]],0,
   "Known from the Dead Sea Scrolls.","ചാവുകടൽ ചുരുളുകളിൽനിന്ന് മനസ്സിലാക്കുന്നു."],
  ["Who said, “I wish that all men were even as I myself” (1 Cor. 7:7)?","“എല്ലാവരും എന്നെപ്പോലെ ആയിരുന്നെങ്കിൽ കൊള്ളാമായിരുന്നു” (1 കൊരി. 7:7) എന്ന് പറഞ്ഞത്?",
   [["St. Paul","പൗലോസ് ശ്ലീഹാ"],["St. Peter","പത്രോസ് ശ്ലീഹാ"],["St. Thomas","മാർത്തോമ്മാ ശ്ലീഹാ"],["St. Antony","അന്തോനിയോസ്"]],0,"",""],
  ["Who is known as the “Father of Monasticism”?","‘സന്യാസപ്രസ്ഥാനത്തിന്റെ പിതാവ്’?",
   [["St. Antony (251-356)","മാർ അന്തോനിയോസ് (251-356)"],["St. Basil","മാർ ബസേലിയോസ്"],["St. Paul","പൗലോസ് ശ്ലീഹാ"],["Mar Ephrem","മാർ അപ്രേം"]],0,
   "He lived long in seclusion in the Egyptian desert.","ഈജിപ്റ്റിലെ മണലാരണ്യത്തിൽ ദീർഘകാലം ഏകാന്തവാസം നയിച്ചു."],
  ["Who began founding monasteries so that ascetics could live together?","സന്യാസികൾ ഒരുമിച്ച് താമസിക്കുന്ന ദയറാകൾ സ്ഥാപിച്ചത്?",
   [["St. Pachomios and St. Basil","പക്കോമിയോസും ബസേലിയോസും"],["Constantine and Valens","കുസ്തന്തീനോസും വാലൻസും"],["Peter and Andrew","പത്രോസും അന്ത്രയോസും"],["Moses and Aaron","മോശയും അഹരോനും"]],0,"",""],
  ["Who made the Milan Proclamation of AD 313?","എ.ഡി. 313-ലെ മിലാൻ പ്രഖ്യാപനം നടത്തിയ ചക്രവർത്തി?",
   [["Emperor Constantine","കുസ്തന്തീനോസ് ചക്രവർത്തി"],["Emperor Valens","വാലൻസ് ചക്രവർത്തി"],["Emperor Diocletian","ഡയോക്ലീഷ്യൻ ചക്രവർത്തി"],["Emperor Nero","നീറോ ചക്രവർത്തി"]],0,
   "It ended persecution but brought worldliness into the Church.","പീഡനം അവസാനിച്ചെങ്കിലും സഭയിൽ ലൗകികത കടന്നുകൂടി."],
  ["What are the three vows of monasticism?","സന്യാസത്തിന്റെ മൂന്ന് വ്രതങ്ങൾ?",
   [["Obedience, poverty and celibacy","അനുസരണം, ദാരിദ്ര്യം, ബ്രഹ്മചര്യം"],["Prayer, fasting and charity","പ്രാർത്ഥന, ഉപവാസം, ദാനം"],["Faith, hope and love","വിശ്വാസം, പ്രത്യാശ, സ്നേഹം"],["Silence, study and work","മൗനം, പഠനം, അദ്ധ്വാനം"]],0,"",""],
  ["Which tradition arose because the faithful admired the pure lives of ascetics?","സന്യാസികളുടെ വിശുദ്ധജീവിതം കണ്ട് സഭയിൽ ഉടലെടുത്ത പാരമ്പര്യം?",
   [["Selecting bishops only from ascetic priests","സന്യാസ പട്ടക്കാരിൽനിന്ന് മാത്രം മേല്പട്ടക്കാരെ തിരഞ്ഞെടുക്കുക"],["Building large palaces","വലിയ കൊട്ടാരങ്ങൾ പണിയുക"],["Electing kings","രാജാക്കന്മാരെ തിരഞ്ഞെടുക്കുക"],["Stopping all marriages","എല്ലാ വിവാഹങ്ങളും നിർത്തുക"]],0,"",""],
  ["Which saints of our Church are examples of this ascetic life?","നമ്മുടെ സഭയിലെ സന്യാസജീവിതത്തിന്റെ ഉദാഹരണങ്ങൾ?",
   [["Parumala Mar Gregorios and Pampady Kuriakose Mar Gregorios","പരുമല തിരുമേനിയും പാമ്പാടി തിരുമേനിയും"],["Cheraman Perumal and Knai Thoma","ചേരമാൻ പെരുമാളും ക്നായി തോമ്മായും"],["Gondaphores and Gad","ഗോണ്ടഫോറസും ഗാദും"],["Constantine and Valens","കുസ്തന്തീനോസും വാലൻസും"]],0,"",""],
  ["“A bishop should be the husband of one wife” (1 Tim. 3:2) shows that…","“അദ്ധ്യക്ഷൻ ഏകഭാര്യയുടെ ഭർത്താവ്” (1 തിമോ. 3:2) വ്യക്തമാക്കുന്നത്…",
   [["Marriage is not a barrier to ministry in the Church","വിവാഹം സഭാശുശ്രൂഷയ്ക്ക് തടസ്സമല്ല"],["Bishops must not marry","മേല്പട്ടക്കാർ വിവാഹം കഴിക്കരുത്"],["Only women can be bishops","സ്ത്രീകൾക്ക് മാത്രം"],["Marriage is better than asceticism","വിവാഹമാണ് ശ്രേഷ്ഠം"]],0,"",""],
  ["Why did some early believers give up family life?","ആദിമസഭയിൽ ചിലർ കുടുംബജീവിതം ഉപേക്ഷിച്ചതിന്റെ ഒരു കാരണം?",
   [["They expected Christ’s Second Coming soon","കർത്താവിന്റെ രണ്ടാം വരവ് ഉടനെ ഉണ്ടാകുമെന്ന് കരുതി"],["They were too poor","അവർ ദരിദ്രരായിരുന്നു"],["The king ordered it","രാജാവ് കല്പിച്ചു"],["They disliked children","കുട്ടികളെ ഇഷ്ടമല്ലായിരുന്നു"]],0,"",""],
  ["The memory verse of this chapter is from…","ഈ പാഠത്തിലെ മനഃപാഠവാക്യം ഏത് ഭാഗത്തുനിന്ന്?",
   [["St. Matthew 9:37-38","മത്തായി 9:37-38"],["St. Matthew 5:48","മത്തായി 5:48"],["1 Corinthians 7:7","1 കൊരി. 7:7"],["Hebrews 13:7","എബ്രാ. 13:7"]],0,"",""]
 ],
 short:[
  {en:"What are the similarities and differences between family life and ascetic life?", ml:"കുടുംബജീവിതവും സന്യാസജീവിതവും തമ്മിലുള്ള സാമ്യങ്ങളും വ്യത്യാസങ്ങളും?",
   aen:["Similarities: Both are called to be perfect (Matthew 5:48). Every baptised believer has one goal – entering godliness through self-purification. An ascetic too is born into a family.","Differences: One grows spiritually within family life; the other gives up family life and lives in a community of ascetics in a monastery. The choice must be free, and once made one must stay faithful to it."],
   aml:["സാമ്യം: ഇരുകൂട്ടരും സൽഗുണസമ്പൂർണ്ണരാകാൻ വിളിക്കപ്പെട്ടവർ (മത്താ. 5:48). മാമോദീസാ ഏറ്റ എല്ലാവരുടെയും ലക്ഷ്യം വിശുദ്ധിയിലൂടെ ദൈവികതയിൽ പ്രവേശിക്കുക. സന്യാസിയും ജനിക്കുന്നത് കുടുംബത്തിൽ.","വ്യത്യാസം: ഒരാൾ കുടുംബത്തിലൂടെ ആത്മീയവളർച്ച നേടുന്നു; മറ്റേയാൾ കുടുംബജീവിതം ഉപേക്ഷിച്ച് ദയറായിൽ സന്യാസിമാരോടൊപ്പം വസിക്കുന്നു. തിരഞ്ഞെടുപ്പ് സ്വതന്ത്രമായിരിക്കണം; തിരഞ്ഞെടുത്തതിൽ വിശ്വസ്തരായിരിക്കണം."]},
  {en:"Explain the three vows of monasticism.", ml:"സന്യാസത്തിന്റെ മൂന്ന് വ്രതങ്ങൾ വിശദീകരിക്കുക.",
   aen:["Obedience – self-discipline learned by obeying a spiritual Master (Guru).","Poverty – willingly rejecting worldly desires.","Celibacy – choosing unmarried life and freeing the mind from sensual pleasures."],
   aml:["അനുസരണം – ഗുരുവിനെ അനുസരിച്ച് ആത്മനിയന്ത്രണം നേടുക.","ദാരിദ്ര്യം – ലോകമോഹങ്ങളെ സ്വമനസ്സാലെ ഉപേക്ഷിക്കുക.","ബ്രഹ്മചര്യം – അവിവാഹിതജീവിതവും ഇന്ദ്രിയസുഖങ്ങളിൽനിന്നുള്ള മാനസിക മോചനവും."]},
  {en:"What are the important responsibilities of ascetics?", ml:"സന്യാസികളുടെ പ്രധാന ചുമതലകൾ ഏവ?",
   aen:["Interceding (praying) for the whole world.","Composing liturgies, prayers and interpretations of the Bible.","Evangelical (mission) work.","Charitable work and service to the poor and sick."],
   aml:["ലോകം മുഴുവനുംവേണ്ടി മദ്ധ്യസ്ഥപ്രാർത്ഥന.","ആരാധനക്രമങ്ങൾ, പ്രാർത്ഥനകൾ, വേദവ്യാഖ്യാനങ്ങൾ എന്നിവ രചിക്കുക.","സുവിശേഷവേല.","ദാനധർമ്മങ്ങളും രോഗികളുടെയും ദരിദ്രരുടെയും ശുശ്രൂഷയും."]},
  {en:"Resolution of this chapter", ml:"ഈ പാഠത്തിലെ നിശ്ചയം",
   aen:["We respectfully remember the monastic fathers who dedicated their lives for the Church. We will keep their model as the guiding light of our lives and serve God as God wills."],
   aml:["സഭയുടെ വളർച്ചയ്ക്കായി സ്വന്തപ്രാണനെ സമർപ്പിച്ച സന്യാസ പിതാക്കന്മാരെ ഞങ്ങൾ ആദരവോടെ ഓർക്കുന്നു. അവർ കാട്ടിത്തന്ന മാതൃക ഞങ്ങളുടെ ജീവിതത്തിന് മാർഗ്ഗദീപമായി ഞങ്ങൾ സൂക്ഷിക്കും."]}
 ]
},
{
 id:"ch22", n:22, en:"St. Basil the Great", ml:"വലിയ മാർ ബസ്സേലിയോസ്",
 verse:{en:"“Remember those who rule over you, who have spoken the word of God to you, whose faith follow, considering the outcome of their conduct.”", ml:"“നിങ്ങളോട് ദൈവവചനം പ്രസംഗിച്ച് നിങ്ങളെ വഴി നടത്തിയവരെ ഓർത്തുകൊൾവിൻ. അവരുടെ ജീവിതാവസാനം ഓർത്ത് അവരുടെ വിശ്വാസം അനുകരിപ്പിൻ”", ref:"Hebrews 13:7 · എബ്രാ. 13:7"},
 mcq:[
  ["The study of the teachings of the Church Fathers is called…","സഭാപിതാക്കന്മാരുടെ പഠിപ്പിക്കലുകളുടെ പഠനം?",
   [["Patristics","പിതൃവിജ്ഞാനീയം (Patristics)"],["Liturgy","ആരാധനാക്രമം"],["Theology of Nature","പ്രകൃതി ദൈവശാസ്ത്രം"],["Church history","സഭാചരിത്രം"]],0,"",""],
  ["‘Baselius’ is the official name taken by…","‘ബസ്സേലിയോസ്’ എന്ന പേര് സ്വീകരിക്കുന്നത്…",
   [["The Catholicos of the East","പൗരസ്ത്യ കാതോലിക്കാ"],["Every priest","എല്ലാ പട്ടക്കാരും"],["Every deacon","എല്ലാ ശെമ്മാശന്മാരും"],["Kings of Kerala","കേരളത്തിലെ രാജാക്കന്മാർ"]],0,
   "e.g. H.H. Baselius Marthoma Mathews III.","ഉദാ. പ. ബസ്സേലിയോസ് മാർത്തോമ്മാ മാത്യൂസ് തൃതീയൻ."],
  ["Who are the three Cappadocian Fathers?","കപ്പദോക്യൻ പിതാക്കന്മാർ ആരെല്ലാം?",
   [["St. Basil, St. Gregory of Nyssa and St. Gregory Nazianzen","മാർ ബസ്സേലിയോസ്, നിസ്സായിലെ മാർ ഗ്രീഗോറിയോസ്, നാസിയാൻസിലെ മാർ ഗ്രീഗോറിയോസ്"],["Peter, Paul and John","പത്രോസ്, പൗലോസ്, യോഹന്നാൻ"],["Ephrem, Severios and Jacob","അപ്രേം, സേവേറിയോസ്, യാക്കോബ്"],["Antony, Pachomios and Macrina","അന്തോനിയോസ്, പക്കോമിയോസ്, മക്രീന"]],0,"",""],
  ["When and where was St. Basil born?","മാർ ബസ്സേലിയോസ് ജനിച്ചത്?",
   [["AD 329, at Pontus in Caesarea","എ.ഡി. 329-ൽ കൈസറിയായിലെ പൊന്തോസിൽ"],["AD 355, in Athens","എ.ഡി. 355-ൽ ഏഥൻസിൽ"],["AD 52, in India","എ.ഡി. 52-ൽ ഇന്ത്യയിൽ"],["AD 313, in Milan","എ.ഡി. 313-ൽ മിലാനിൽ"]],0,"",""],
  ["During whose persecution did Basil’s forefathers suffer?","ആരുടെ പീഡനകാലത്താണ് ബസ്സേലിയോസിന്റെ പൂർവ്വികർ കഷ്ടം സഹിച്ചത്?",
   [["Emperor Diocletian","ഡയോക്ലീഷ്യൻ ചക്രവർത്തി"],["Emperor Constantine","കുസ്തന്തീനോസ് ചക്രവർത്തി"],["King Gondaphores","ഗോണ്ടഫോറസ് രാജാവ്"],["King Herod","ഹെരോദാ രാജാവ്"]],0,"",""],
  ["Where did Basil have his higher education?","ബസ്സേലിയോസ് ഉപരിപഠനം നടത്തിയത്?",
   [["Constantinople and Athens","കുസ്തന്തീനോപ്പോലീസിലും ഏഥൻസിലും"],["Rome and Jerusalem","റോമായിലും യെരുശലേമിലും"],["Alexandria and Antioch","അലക്സാന്ത്രിയായിലും അന്ത്യോഖ്യായിലും"],["Kerala and Persia","കേരളത്തിലും പേർഷ്യയിലും"]],0,"",""],
  ["St. Basil’s most notable writings are about…","മാർ ബസ്സേലിയോസിന്റെ ഏറ്റവും ശ്രദ്ധേയമായ രചനകൾ?",
   [["The Holy Spirit","പരിശുദ്ധാത്മാവിനെപ്പറ്റി"],["Farming","കൃഷിയെപ്പറ്റി"],["Wars","യുദ്ധങ്ങളെപ്പറ്റി"],["Music","സംഗീതത്തെപ്പറ്റി"]],0,
   "He defended the divinity of Christ and the Godhead of the Holy Spirit.","ക്രിസ്തുവിന്റെ ദൈവത്വവും പരിശുദ്ധാത്മാവിന്റെ ദൈവത്വവും അദ്ദേഹം സ്ഥാപിച്ചു."],
  ["At what age did Basil take up monastic life?","എത്രാം വയസ്സിലാണ് ബസ്സേലിയോസ് സന്യാസജീവിതം തിരഞ്ഞെടുത്തത്?",
   [["26","26"],["41","41"],["50","50"],["12","12"]],0,"",""],
  ["Who inspired Basil to take up the ascetic life?","സന്യാസത്തിലേക്ക് ബസ്സേലിയോസിനെ പ്രേരിപ്പിച്ചത്?",
   [["His grandmother and elder sister, both named Macrina","മക്രീന എന്ന് പേരുള്ള വല്യമ്മയും മൂത്ത സഹോദരിയും"],["His father and mother","അപ്പനും അമ്മയും"],["The emperor","ചക്രവർത്തി"],["His teachers in Athens","ഏഥൻസിലെ ഗുരുക്കന്മാർ"]],0,"",""],
  ["History records that St. Basil was the first to start…","ചരിത്രത്തിൽ ആദ്യമായി ബസ്സേലിയോസ് ആരംഭിച്ചത്…",
   [["Hospitals giving care with accommodation for patients","രോഗികളെ താമസിപ്പിച്ച് ചികിത്സിക്കുന്ന ആശുപത്രി"],["Schools for kings","രാജാക്കന്മാർക്കുള്ള സ്കൂൾ"],["Newspapers","പത്രങ്ങൾ"],["Boat races","വള്ളംകളി"]],0,"",""],
  ["At what age was Basil made Bishop of Caesarea?","എത്രാം വയസ്സിലാണ് കൈസറിയായുടെ മെത്രാപ്പോലീത്തയായത്?",
   [["41, as successor of Eusebius","41-ൽ, യൗസേബിയോസിന്റെ പിൻഗാമിയായി"],["26, as successor of Antony","26-ൽ, അന്തോനിയോസിന്റെ പിൻഗാമിയായി"],["50, as successor of Gregory","50-ൽ, ഗ്രീഗോറിയോസിന്റെ പിൻഗാമിയായി"],["30, as successor of Peter","30-ൽ, പത്രോസിന്റെ പിൻഗാമിയായി"]],0,"",""],
  ["When did St. Basil die?","മാർ ബസ്സേലിയോസ് കാലം ചെയ്തത്?",
   [["AD 379, at the age of 50","എ.ഡി. 379-ൽ, 50-ാം വയസ്സിൽ"],["AD 394, at 39","എ.ഡി. 394-ൽ, 39-ാം വയസ്സിൽ"],["AD 313, at 60","എ.ഡി. 313-ൽ, 60-ാം വയസ്സിൽ"],["AD 649, at 70","എ.ഡി. 649-ൽ, 70-ാം വയസ്സിൽ"]],0,"",""],
  ["On which day do the Oriental Churches commemorate St. Basil?","പൗരസ്ത്യ സഭകൾ മാർ ബസ്സേലിയോസിന്റെ ഓർമ്മ ആചരിക്കുന്നത്?",
   [["January 1","ജനുവരി 1"],["June 29","ജൂൺ 29"],["August 15","ആഗസ്റ്റ് 15"],["December 25","ഡിസംബർ 25"]],0,"",""],
  ["‘Heretics’ are those who…","‘വേദവിപരീതികൾ’ എന്നാൽ…",
   [["Go against the Orthodox faith of the Church","സഭയുടെ സത്യവിശ്വാസത്തിന് എതിരായി നിൽക്കുന്നവർ"],["Fast regularly","പതിവായി ഉപവസിക്കുന്നവർ"],["Sing in the choir","ഗായകസംഘത്തിൽ പാടുന്നവർ"],["Live in monasteries","ദയറാകളിൽ ജീവിക്കുന്നവർ"]],0,"",""],
  ["The memory verse of this chapter is from…","ഈ പാഠത്തിലെ മനഃപാഠവാക്യം ഏത് ഭാഗത്തുനിന്ന്?",
   [["Hebrews 13:7","എബ്രാ. 13:7"],["Philippians 1:21","ഫിലി. 1:21"],["St. Matthew 9:37","മത്തായി 9:37"],["Psalm 92:12","സങ്കീ. 92:12"]],0,"",""]
 ],
 short:[
  {en:"Who are the Cappadocian Fathers? What are their specialities?", ml:"കപ്പദോക്യൻ പിതാക്കന്മാർ ആരെല്ലാം? അവരുടെ പ്രത്യേകതകൾ?",
   aen:["St. Basil the Great, his brother St. Gregory of Nyssa and their friend St. Gregory Nazianzen.","They were great theologians and saints who led lives of renunciation. Being scholars, they answered the learned heretics and laid the foundation of the Orthodox faith. Their contributions to monasticism are very important."],
   aml:["വലിയ മാർ ബസ്സേലിയോസ്, സഹോദരൻ നിസ്സായിലെ മാർ ഗ്രീഗോറിയോസ്, സ്നേഹിതൻ നാസിയാൻസിലെ മാർ ഗ്രീഗോറിയോസ്.","ത്യാഗജീവിതം നയിച്ച വേദശാസ്ത്രജ്ഞരും പരിശുദ്ധരുമായിരുന്നു. പണ്ഡിതരായ വേദവിപരീതികൾക്ക് മറുപടി നൽകി സത്യവിശ്വാസത്തിന് അടിത്തറയിട്ടു. സന്യാസപ്രസ്ഥാനത്തിനും വലിയ സംഭാവനകൾ നൽകി."]},
  {en:"What were St. Basil’s contributions to monasticism and society?", ml:"സന്യാസപ്രസ്ഥാനത്തിനും സമൂഹത്തിനും മാർ ബസ്സേലിയോസിന്റെ സംഭാവനകൾ?",
   aen:["He gathered solitary ascetics and organised them into communities, which were better for spreading the Gospel and protecting the needy.","Along with monasteries he set up homes for orphans, the destitute and the sick.","He started hospitals that cared for patients with accommodation.","He wrote rules for monks, guiding them to lead a simple life."],
   aml:["ഏകാന്തവാസികളായ സന്യാസികളെ ഒരുമിച്ച് ചേർത്ത് സമൂഹമാക്കി; അത് സുവിശേഷപ്രചരണത്തിനും സാധുസംരക്ഷണത്തിനും നല്ലതായിരുന്നു.","ദയറാകളോടൊപ്പം അനാഥർക്കും അഗതികൾക്കും രോഗികൾക്കും താമസസൗകര്യം ഒരുക്കി.","രോഗികളെ താമസിപ്പിച്ച് ചികിത്സിക്കുന്ന ആശുപത്രി ആദ്യമായി ആരംഭിച്ചു.","ലളിതജീവിതം നയിക്കാൻ സന്യാസികൾക്കായി നിയമാവലികൾ എഴുതി."]},
  {en:"Write about the family background and education of St. Basil.", ml:"മാർ ബസ്സേലിയോസിന്റെ കുടുംബപശ്ചാത്തലവും വിദ്യാഭ്യാസവും.",
   aen:["Born in AD 329 at Pontus in Caesarea into a rich and distinguished family. His forefathers suffered in Diocletian’s persecution. He studied first in his own country, then in Caesarea, and had higher education in Constantinople and Athens. Though he learned many religious thoughts, he never moved away from the Orthodox faith."],
   aml:["എ.ഡി. 329-ൽ കൈസറിയായിലെ പൊന്തോസിൽ സമ്പന്നവും കുലീനവുമായ കുടുംബത്തിൽ ജനിച്ചു. ഡയോക്ലീഷ്യന്റെ പീഡനകാലത്ത് പൂർവ്വികർ കഷ്ടം സഹിച്ചു. സ്വന്തനാട്ടിലും കൈസറിയായിലും പഠിച്ചശേഷം കുസ്തന്തീനോപ്പോലീസിലും ഏഥൻസിലും ഉപരിപഠനം നടത്തി. പല മതചിന്തകളും പഠിച്ചെങ്കിലും സത്യവിശ്വാസത്തിൽനിന്ന് വ്യതിചലിച്ചില്ല."]},
  {en:"Resolution of this chapter", ml:"ഈ പാഠത്തിലെ നിശ്ചയം",
   aen:["We would follow the model of St. Basil the Great in living a disciplined life, and boldly uphold the faith for the sake of our Church."],
   aml:["വലിയ മാർ ബസ്സേലിയോസിന്റെ ജീവിതത്തെ അനുകരിക്കും. സഭയ്ക്കുവേണ്ടി ധീരതയോടെ വിശ്വാസത്തെ മുറുകെപ്പിടിച്ച് ജീവിക്കും."]}
 ]
},
{
 id:"ch23", n:23, en:"St. Gregory of Nyssa", ml:"നിസ്സായിലെ മാർ ഗ്രീഗോറിയോസ്",
 verse:{en:"“For to me, to live is Christ and to die is gain.”", ml:"“എനിക്ക് ജീവിക്കുന്നത് ക്രിസ്തുവും മരിക്കുന്നത് ലാഭവും ആകുന്നു”", ref:"Philippians 1:21 · ഫിലി. 1:21"},
 mcq:[
  ["St. Gregory of Nyssa was the ___ of St. Basil the Great.","നിസ്സായിലെ മാർ ഗ്രീഗോറിയോസ് വലിയ മാർ ബസ്സേലിയോസിന്റെ…",
   [["Younger brother","ഇളയ സഹോദരൻ"],["Father","പിതാവ്"],["Teacher","ഗുരു"],["Friend only","സ്നേഹിതൻ മാത്രം"]],0,"",""],
  ["What does the name ‘Gregory’ (Gregorios) mean?","‘ഗ്രീഗോറിയോസ്’ എന്ന വാക്കിന്റെ അർത്ഥം?",
   [["One who is awake","ഉണർന്നിരിക്കുന്നവൻ"],["One who is peaceful","സമാധാനമുള്ളവൻ"],["Breaker of idols","വിഗ്രഹഭഞ്ജകൻ"],["Twin","ഇരട്ട"]],0,"",""],
  ["Who were his parents?","അദ്ദേഹത്തിന്റെ മാതാപിതാക്കൾ?",
   [["St. Basil the Elder and Emmelia","വലിയ ബസേലിയോസും എമ്മേലിയായും"],["Elkanah and Hannah","എല്ക്കാനായും ഹന്നായും"],["Jesse and his wife","യിശ്ശായിയും ഭാര്യയും"],["Gad and Macrina","ഗാദും മക്രീനയും"]],0,"",""],
  ["Which subjects did Gregory master in his early life?","ആദ്യകാലത്ത് ഗ്രീഗോറിയോസ് പ്രാവീണ്യം നേടിയ വിഷയങ്ങൾ?",
   [["World literature, philosophy and medicine","വിശ്വസാഹിത്യം, തത്വചിന്ത, വൈദ്യശാസ്ത്രം"],["Farming and fishing","കൃഷിയും മീൻപിടുത്തവും"],["Architecture and painting","വാസ്തുവിദ്യയും ചിത്രരചനയും"],["Law and war","നിയമവും യുദ്ധവും"]],0,
   "He also worked as a language teacher for some time.","കുറച്ചുകാലം ഭാഷാദ്ധ്യാപകനായും ജോലി ചെയ്തു."],
  ["Whom did Gregory marry?","ഗ്രീഗോറിയോസ് വിവാഹം ചെയ്തത്?",
   [["Theosebia (said to have been a deaconess)","തെയോസേബിയ (ഒരു ശെമ്മാശിനി ആയിരുന്നു എന്ന് പറയപ്പെടുന്നു)"],["Macrina","മക്രീന"],["Emmelia","എമ്മേലിയ"],["Hannah","ഹന്നാ"]],0,"",""],
  ["St. Basil had founded a monastery on the banks of the river…","ബസ്സേലിയോസ് ആശ്രമം സ്ഥാപിച്ചിരുന്നത് ഏത് നദീതീരത്ത്?",
   [["Iris","ഐറിസ്"],["Jordan","യോർദ്ദാൻ"],["Nile","നീൽ"],["Euphrates","യൂഫ്രട്ടീസ്"]],0,"",""],
  ["When was Gregory appointed Bishop of Nyssa?","നിസ്സായിലെ എപ്പിസ്കോപ്പായി നിയമിക്കപ്പെട്ടത്?",
   [["AD 371","എ.ഡി. 371"],["AD 381","എ.ഡി. 381"],["AD 329","എ.ഡി. 329"],["AD 394","എ.ഡി. 394"]],0,"",""],
  ["Which emperor exiled Gregory?","ഗ്രീഗോറിയോസിനെ നാടുകടത്തിയ ചക്രവർത്തി?",
   [["Valens, a follower of Arius","അറിയോസിന്റെ അനുയായിയായ വാലൻസ്"],["Constantine","കുസ്തന്തീനോസ്"],["Diocletian","ഡയോക്ലീഷ്യൻ"],["Nero","നീറോ"]],0,"",""],
  ["Gregory fought against which heresy?","ഗ്രീഗോറിയോസ് എതിർത്ത വേദവിപരീതം?",
   [["Arianism","അറിയോസിന്റെ വേദവിപരീതം (Arianism)"],["Idol worship of Baal","ബാൽ ആരാധന"],["Sun worship","സൂര്യാരാധന"],["Paganism of Rome only","റോമൻ വിഗ്രഹാരാധന മാത്രം"]],0,"",""],
  ["Gregory played a key role in compiling the Creed at the Council of…","ഏത് സുന്നഹദോസിലാണ് വിശ്വാസപ്രമാണം ക്രോഡീകരിക്കുന്നതിൽ ഗ്രീഗോറിയോസ് മുഖ്യപങ്ക് വഹിച്ചത്?",
   [["Constantinople, AD 381","കുസ്തന്തീനോപ്പോലീസ്, എ.ഡി. 381"],["Nicaea, AD 325","നിഖ്യാ, എ.ഡി. 325"],["Ephesus, AD 431","എഫേസൂസ്, എ.ഡി. 431"],["Milan, AD 313","മിലാൻ, എ.ഡി. 313"]],0,"",""],
  ["In the social realm, Gregory argued that…","സാമൂഹ്യരംഗത്ത് ഗ്രീഗോറിയോസ് വാദിച്ചത്…",
   [["Slavery is a sin","അടിമസമ്പ്രദായം തിന്മയാണ്"],["Kings should be worshipped","രാജാക്കന്മാരെ ആരാധിക്കണം"],["Education is useless","വിദ്യാഭ്യാസം വ്യർത്ഥമാണ്"],["Wars are good","യുദ്ധം നല്ലതാണ്"]],0,"",""],
  ["Gregory of Nyssa is called…","നിസ്സായിലെ ഗ്രീഗോറിയോസ് അറിയപ്പെടുന്നത്…",
   [["The Star of Nyssa","നിസ്സായിലെ നക്ഷത്രം"],["Lyre of the Holy Spirit","പരിശുദ്ധാത്മാവിന്റെ കിന്നരം"],["Father of Monasticism","സന്യാസത്തിന്റെ പിതാവ്"],["Treasure of virtues","സദ്ഗുണനിധി"]],0,
   "He died in AD 394.","എ.ഡി. 394-ൽ അദ്ദേഹം കാലം ചെയ്തു."],
  ["Which Malankara bishop wrote at length about Gregory of Nyssa?","നിസ്സായിലെ ഗ്രീഗോറിയോസിനെപ്പറ്റി വിശദമായി എഴുതിയ മലങ്കര സഭയിലെ പണ്ഡിതൻ?",
   [["H.G. Paulose Mar Gregorios","പൗലൂസ് മാർ ഗ്രീഗോറിയോസ് തിരുമേനി"],["Parumala Thirumeni","പരുമല തിരുമേനി"],["Pampady Thirumeni","പാമ്പാടി തിരുമേനി"],["Mar Yuhanon I","മാർ യൂഹാനോൻ ഒന്നാമൻ"]],0,
   "His book is ‘Cosmic Man’.","അദ്ദേഹത്തിന്റെ ഗ്രന്ഥം ‘Cosmic Man’."],
  ["What was the real name of St. Gregorios of Parumala?","പരുമല തിരുമേനിയുടെ യഥാർത്ഥ പേര്?",
   [["Geevarghese Mar Gregorios","ഗീവർഗ്ഗീസ് മാർ ഗ്രീഗോറിയോസ്"],["Kuriakose Mar Gregorios","കുറിയാക്കോസ് മാർ ഗ്രീഗോറിയോസ്"],["Paulose Mar Gregorios","പൗലൂസ് മാർ ഗ്രീഗോറിയോസ്"],["Mathews Mar Baselios","മാത്യൂസ് മാർ ബസേലിയോസ്"]],0,"",""],
  ["The memory verse of this chapter is from…","ഈ പാഠത്തിലെ മനഃപാഠവാക്യം ഏത് ഭാഗത്തുനിന്ന്?",
   [["Philippians 1:21","ഫിലി. 1:21"],["Hebrews 13:7","എബ്രാ. 13:7"],["Romans 8:17","റോമ. 8:17"],["Psalm 115:16","സങ്കീ. 115:16"]],0,"",""]
 ],
 short:[
  {en:"What were the formative factors that shaped the life of St. Gregory of Nyssa?", ml:"നിസ്സായിലെ മാർ ഗ്രീഗോറിയോസിന്റെ ജീവിതത്തെ സ്വാധീനിച്ച ഘടകങ്ങൾ?",
   aen:["The devotional life of his father St. Basil the Elder and mother Emmelia.","The influence of his elder brother St. Basil the Great.","His education at Caesarea and Athens.","Life in the monastery on the banks of the river Iris, which turned his thoughts towards mysticism."],
   aml:["പിതാവ് വലിയ ബസേലിയോസിന്റെയും മാതാവ് എമ്മേലിയായുടെയും ഭക്തിജീവിതം.","മൂത്ത സഹോദരൻ വലിയ മാർ ബസ്സേലിയോസിന്റെ സ്വാധീനം.","കൈസറിയായിലും ഏഥൻസിലുമുള്ള വിദ്യാഭ്യാസം.","ഐറിസ് നദീതീരത്തെ ആശ്രമജീവിതം; അത് അദ്ദേഹത്തിന്റെ ചിന്തകളെ ആത്മീയ ദർശനത്തിലേക്ക് (Mystical) നയിച്ചു."]},
  {en:"What was his contribution at the Council of Constantinople?", ml:"കുസ്തന്തീനോപ്പോലീസ് സുന്നഹദോസിൽ അദ്ദേഹത്തിന്റെ സംഭാവന?",
   aen:["At the Second General Council of Constantinople (AD 381) he played a key role in compiling the Creed. A good orator and theologian, he taught with authority about the Holy Trinity, the Incarnation of Christ, salvation, the sacraments and the procession of the Holy Spirit."],
   aml:["എ.ഡി. 381-ലെ രണ്ടാം പൊതു സുന്നഹദോസിൽ വിശ്വാസപ്രമാണം ക്രോഡീകരിക്കുന്നതിൽ മുഖ്യപങ്ക് വഹിച്ചു. നല്ല വാഗ്മിയും വേദശാസ്ത്രജ്ഞനുമായിരുന്ന അദ്ദേഹം വി. ത്രിത്വം, ക്രിസ്തുവിന്റെ മനുഷ്യാവതാരം, രക്ഷ, കൂദാശകൾ, പരിശുദ്ധാത്മാവിന്റെ പുറപ്പാട് എന്നിവയെക്കുറിച്ച് ആധികാരികമായി പഠിപ്പിച്ചു."]},
  {en:"What are the distinguishing qualities in the life of St. Gregory of Nyssa?", ml:"മാർ ഗ്രീഗോറിയോസിന്റെ ജീവിതത്തിലെ വൈശിഷ്ട്യങ്ങൾ?",
   aen:["He ordered his life according to the faith of the Church.","He lived with total reliance on God and showed that no worldly thing equals God.","His writings are marked by literary beauty and spiritual wisdom.","He stood firmly against heresy even when exiled.","He taught that slavery is a sin."],
   aml:["സഭയുടെ വിശ്വാസത്തിന് യോജിച്ച രീതിയിൽ ജീവിതം ക്രമീകരിച്ചു.","ദൈവത്തിൽ പൂർണ്ണമായി ആശ്രയിച്ചു; ഒരു ലോകവസ്തുവും ദൈവത്തിന് തുല്യമല്ലെന്ന് ജീവിതത്തിലൂടെ തെളിയിച്ചു.","രചനകൾ സാഹിത്യഭംഗിയും ആദ്ധ്യാത്മിക ചൈതന്യവും നിറഞ്ഞവ.","നാടുകടത്തപ്പെട്ടിട്ടും വേദവിപരീതത്തിനെതിരെ ഉറച്ചുനിന്നു.","അടിമസമ്പ്രദായം തിന്മയാണെന്ന് പഠിപ്പിച്ചു."]},
  {en:"Resolution of this chapter", ml:"ഈ പാഠത്തിലെ നിശ്ചയം",
   aen:["We would try to imitate the good models of St. Gregory of Nyssa’s life and will not compromise with heretics."],
   aml:["സഭാപിതാവായ മാർ ഗ്രീഗോറിയോസിന്റെ ജീവിത വൈശിഷ്ട്യങ്ങൾ ഞങ്ങൾ മനസ്സിലാക്കി. ആ ജീവിതത്തിലെ നല്ല മാതൃകകൾ ഉൾക്കൊള്ളാൻ ഞങ്ങൾ എന്നും ശ്രമിക്കും. ഒപ്പം വിശ്വാസ വിപരീതികളോട് സമരസപ്പെടുകയില്ല."]}
 ]
},
{
 id:"ch24", n:24, en:"Holistic Health Care", ml:"സമ്പൂർണ്ണ ആരോഗ്യപരിപാലനം",
 verse:{en:"“The light of the eyes rejoices the heart, and a good report makes the bones healthy.” (Proverbs 15:30)", ml:"“സന്തുഷ്ട ഹൃദയം നല്ലൊരു ഔഷധമാകുന്നു. തകർന്ന മനസ്സോ അസ്ഥികളെ ഉണക്കുന്നു” (സദൃശവാക്യങ്ങൾ 17:22)", ref:"Proverbs 15:30 (English book) · സദൃ. 17:22 (മലയാളം പുസ്തകം)"},
 mcq:[
  ["How does the World Health Organization describe health?","ലോകാരോഗ്യസംഘടന ആരോഗ്യത്തെ നിർവ്വചിക്കുന്നത്?",
   [["A balanced state of body, mind and spirit","ശാരീരികവും മാനസികവും ആദ്ധ്യാത്മികവുമായ സന്തുലിതാവസ്ഥ"],["Having no illness only","രോഗമില്ലാത്ത അവസ്ഥ മാത്രം"],["Having a lot of money","ധാരാളം പണമുള്ള അവസ്ഥ"],["Being very strong","വളരെ ബലമുള്ള അവസ്ഥ"]],0,"",""],
  ["Real health is a state of comfort at which levels?","യഥാർത്ഥ ആരോഗ്യം ഏതെല്ലാം തലങ്ങളിലെ സുഖാവസ്ഥയാണ്?",
   [["Physical, mental, social and spiritual","ശാരീരിക, മാനസിക, സാമൂഹിക, ആത്മീയ"],["Only physical","ശാരീരികം മാത്രം"],["Only mental","മാനസികം മാത്രം"],["Only financial","സാമ്പത്തികം മാത്രം"]],0,"",""],
  ["Which of these is NOT a healthy habit from the lesson?","പാഠത്തിലെ നല്ല ശീലങ്ങളിൽ പെടാത്തത്?",
   [["Overeating fatty food","കൊഴുപ്പേറിയ ഭക്ഷണം അമിതമായി കഴിക്കുക"],["Taking a shower","കുളിക്കുക"],["Prayer","പ്രാർത്ഥിക്കുക"],["Observing fasting","ഉപവസിക്കുക"]],0,"",""],
  ["Which is one of the four main causes of ill-health?","അനാരോഗ്യത്തിന്റെ നാല് കാരണങ്ങളിൽ ഒന്ന്?",
   [["Lack of exercise and tension in life","വ്യായാമരഹിതവും മാനസികസംഘർഷം നിറഞ്ഞതുമായ ജീവിതം"],["Too much prayer","അമിത പ്രാർത്ഥന"],["Reading books","പുസ്തകവായന"],["Drinking water","വെള്ളം കുടിക്കുന്നത്"]],0,"",""],
  ["How much water should we drink every day?","ദിവസവും കുറഞ്ഞത് എത്ര ഗ്ലാസ് വെള്ളം കുടിക്കണം?",
   [["At least eight glasses","കുറഞ്ഞത് എട്ട് ഗ്ലാസ്"],["One glass","ഒരു ഗ്ലാസ്"],["Three glasses","മൂന്ന് ഗ്ലാസ്"],["Twenty glasses","ഇരുപത് ഗ്ലാസ്"]],0,"",""],
  ["Sunbathing (morning sunlight) is especially good for…","പ്രഭാതവെയിൽ കൊള്ളുന്നത് പ്രത്യേകിച്ച് നല്ലത്…",
   [["Joints and muscles","സന്ധികൾക്കും മാംസപേശികൾക്കും"],["Hair only","മുടിക്ക് മാത്രം"],["Teeth only","പല്ലിന് മാത്രം"],["Nothing","ഒന്നിനുമല്ല"]],0,"",""],
  ["Which spiritual exercise of Orthodox worship gives health to body, mind and soul?","ശരീരത്തിനും മനസ്സിനും ആത്മാവിനും ആരോഗ്യം നൽകുന്ന ഓർത്തഡോക്സ് ആരാധനയിലെ ആത്മീയ വ്യായാമം?",
   [["Prostration (kneeling and bowing) in prayer","കുമ്പിട്ടുള്ള പ്രാർത്ഥന"],["Sitting quietly","നിശ്ശബ്ദമായി ഇരിക്കുന്നത്"],["Lighting candles","മെഴുകുതിരി കത്തിക്കുന്നത്"],["Ringing bells","മണിയടിക്കുന്നത്"]],0,
   "It also shows complete submission to God in humility.","താഴ്മയോടെയുള്ള പൂർണ്ണ സമർപ്പണത്തെയും സൂചിപ്പിക്കുന്നു."],
  ["According to the lesson, childhood and adolescence are the period of…","ബാല്യ-കൗമാരകാലം…",
   [["Physical and mental development","ശരീരത്തിന്റെയും മനസ്സിന്റെയും വളർച്ചയുടെ കാലം"],["Preparing for the end of life","ജീവിതാന്ത്യത്തിനുള്ള ഒരുക്കത്തിന്റെ കാലം"],["Building the next generation","അടുത്ത തലമുറയെ വാർത്തെടുക്കുന്ന കാലം"],["Rest and retirement","വിശ്രമകാലം"]],0,"",""],
  ["Old age is the period of…","വാർദ്ധക്യം…",
   [["Evaluating one’s life and preparing for its end","സ്വയം ജീവിതത്തെ വിലയിരുത്താനും ജീവിതാന്ത്യത്തിന് ഒരുങ്ങാനുമുള്ള കാലം"],["Physical growth","ശാരീരിക വളർച്ചയുടെ കാലം"],["Starting school","സ്കൂൾ തുടങ്ങുന്ന കാലം"],["Learning to walk","നടക്കാൻ പഠിക്കുന്ന കാലം"]],0,"",""],
  ["Lifestyle diseases are caused mainly by…","ജീവിതശൈലീരോഗങ്ങളുടെ പ്രധാന കാരണം…",
   [["High-calorie fatty food with little exercise","കലോറി കൂടിയ കൊഴുപ്പേറിയ ഭക്ഷണവും വ്യായാമമില്ലായ്മയും"],["Eating vegetables","പച്ചക്കറി കഴിക്കുന്നത്"],["Walking daily","ദിവസവും നടക്കുന്നത്"],["Praying","പ്രാർത്ഥിക്കുന്നത്"]],0,"",""],
  ["The Church encourages a change of diet during…","ഭക്ഷണക്രമത്തിൽ മാറ്റം വരുത്താൻ സഭ ആഹ്വാനം ചെയ്യുന്നത്…",
   [["Fasting seasons","നോമ്പുകാലങ്ങളിൽ"],["Birthdays","ജന്മദിനങ്ങളിൽ"],["Weddings","വിവാഹങ്ങളിൽ"],["School holidays","സ്കൂൾ അവധിക്കാലത്ത്"]],0,"",""],
  ["“My heart is overflowing with a good theme” is from…","“എന്റെ ഹൃദയം ശുഭവചനത്താൽ കവിയുന്നു” ഏത് വാക്യം?",
   [["Psalm 45:1","സങ്കീ. 45:1"],["Psalm 115:16","സങ്കീ. 115:16"],["Proverbs 17:22","സദൃ. 17:22"],["Psalm 141:2","സങ്കീ. 141:2"]],0,
   "We keep our mind healthy by filling it with good thoughts.","ശുഭചിന്തകളാൽ മനസ്സ് നിറയ്ക്കണം."],
  ["The hymn “O Lord kindly conserve me as the apple of Your eyes” is from the…","“എന്നുടയോനേ നീയെന്നെ കൺമണിപോൽ കാത്തിടണമേ” – ഈ ഗീതം…",
   [["Memra of penitence","അനുതാപത്തിന്റെ മെമ്രാ"],["Kukiliyon of saints","പരിശുദ്ധന്മാരുടെ കുക്കിലിയോൻ"],["Christmas service","ക്രിസ്മസ് ശുശ്രൂഷ"],["Wedding service","വിവാഹ ശുശ്രൂഷ"]],0,
   "Say the full Memra of penitence at home every day.","അനുതാപത്തിന്റെ മെമ്രാ പൂർണ്ണമായി ദിവസവും വീട്ടിൽ ചൊല്ലുക."],
  ["Our body is the abode (dwelling place) of…","നമ്മുടെ ശരീരം ആരുടെ വാസസ്ഥലമാണ്?",
   [["God’s Spirit","ദൈവാത്മാവിന്റെ"],["Our pets","വളർത്തുമൃഗങ്ങളുടെ"],["Our friends","സുഹൃത്തുക്കളുടെ"],["Nobody","ആരുടേതുമല്ല"]],0,"",""],
  ["Can we buy health from hospitals or supermarkets?","ആരോഗ്യം ആശുപത്രിയിൽനിന്നോ സൂപ്പർമാർക്കറ്റിൽനിന്നോ വാങ്ങാമോ?",
   [["No – it needs knowledge, determination and constant effort","ഇല്ല – അറിവും ദൃഢനിശ്ചയവും സ്ഥിരപരിശ്രമവും വേണം"],["Yes, from hospitals","ഉണ്ട്, ആശുപത്രിയിൽനിന്ന്"],["Yes, from medical stores","ഉണ്ട്, മെഡിക്കൽ സ്റ്റോറിൽനിന്ന്"],["Yes, from supermarkets","ഉണ്ട്, സൂപ്പർമാർക്കറ്റിൽനിന്ന്"]],0,"",""]
 ],
 short:[
  {en:"What do you mean by health? What are the good habits we should cultivate?", ml:"ആരോഗ്യം എന്നാൽ എന്ത്? നാം വളർത്തേണ്ട നല്ല ശീലങ്ങൾ?",
   aen:["Health is not just the absence of disease – it is a holistic state of comfort at the physical, mental, social and spiritual levels (WHO: balance of body, mind and spirit).","Good habits: taking a shower, play, learning, prayer, eating good food, observing fasts, and cleanliness."],
   aml:["രോഗമില്ലായ്മ മാത്രമല്ല ആരോഗ്യം; ശാരീരിക, മാനസിക, സാമൂഹിക, ആത്മീയ തലങ്ങളിലെ സമ്പൂർണ്ണ സുഖാവസ്ഥയാണ് യഥാർത്ഥ ആരോഗ്യം.","നല്ല ശീലങ്ങൾ: കുളിക്കുക, കളിക്കുക, പഠിക്കുക, പ്രാർത്ഥിക്കുക, നല്ല ഭക്ഷണം കഴിക്കുക, ഉപവസിക്കുക, നോമ്പ് ആചരിക്കുക, വൃത്തി സൂക്ഷിക്കുക."]},
  {en:"What are the general reasons for ill-health?", ml:"അനാരോഗ്യത്തിന്റെ കാരണങ്ങൾ എന്തെല്ലാം?",
   aen:["Lack of exercise and tension in life.","Diseases caused by changes in food habits and food materials.","Pollution of the atmosphere and environment.","Lack of awareness about health care."],
   aml:["വ്യായാമരഹിതവും മാനസികസംഘർഷം നിറഞ്ഞതുമായ ജീവിതരീതി.","ആഹാരരീതിയിലും ആഹാരസാധനങ്ങളിലും വന്ന മാറ്റങ്ങൾ വരുത്തുന്ന രോഗങ്ങൾ.","അന്തരീക്ഷ–പരിസര മലിനീകരണം.","ആരോഗ്യസംരക്ഷണത്തെപ്പറ്റിയുള്ള അവബോധമില്ലായ്മ."]},
  {en:"What should we do to protect our health?", ml:"ആരോഗ്യസംരക്ഷണത്തിന് നാം എന്തു ചെയ്യണം?",
   aen:["Regular physical exercise and breathing exercise.","A balanced diet; avoid fatty, high-calorie food; drink at least eight glasses of water a day.","Take morning sunlight for joints and muscles.","Practise prostration in daily prayer.","Keep the mind pure with good, positive thoughts."],
   aml:["പതിവായ വ്യായാമവും ശ്വസനവ്യായാമവും.","സമീകൃതാഹാരം; കൊഴുപ്പേറിയ ഭക്ഷണം ഒഴിവാക്കുക; ദിവസവും കുറഞ്ഞത് 8 ഗ്ലാസ് വെള്ളം.","സന്ധികൾക്കും പേശികൾക്കും പ്രഭാതവെയിൽ.","ദിവസവും കുമ്പിട്ടുള്ള പ്രാർത്ഥന.","ശുഭചിന്തകളാൽ മനസ്സ് ശുദ്ധമായി സൂക്ഷിക്കുക."]},
  {en:"Resolution of this chapter", ml:"ഈ പാഠത്തിലെ നിശ്ചയം",
   aen:["We would keep our body and mind in an appropriate manner and never misuse them. We would follow good habits and kneel and worship God every day."],
   aml:["ശരീരത്തേയും മനസ്സിനേയും ഉചിതമായി കാക്കും. ശരീരത്തിനും മനസ്സിനും ആത്മാവിനും വിരുദ്ധമായി ഒന്നും ചെയ്യുകയില്ല. നല്ല ശീലങ്ങൾ പ്രാവർത്തികമാക്കുന്നതിനോടൊപ്പം കുമ്പിട്ട് ദൈവത്തെ എല്ലാ ദിവസവും ആരാധിക്കും."]}
 ]
},
{
 id:"ch25", n:25, en:"Love of Nature", ml:"പ്രകൃതിസ്നേഹം",
 verse:{en:"“Heaven belongs to the Lord, but He gave the earth to man.” (Psalm 115:16)", ml:"“ആകാശം ദൈവത്തിന്റെ മഹത്വത്തെ വർണ്ണിക്കുന്നു. ആകാശവിതാനം അവന്റെ കൈവേലയെ പ്രസിദ്ധമാക്കുന്നു” (സങ്കീ. 19:1)", ref:"Psalm 115:16 (English book) · സങ്കീ. 19:1 (മലയാളം പുസ്തകം)"},

/* ---------- HELPERS ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const bi = (en, ml, tag="span") => `<${tag} class="en">${esc(en)}</${tag}>${ml ? `<${tag} class="ml">${esc(ml)}</${tag}>` : ""}`;
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};

/* ---------- LANGUAGE ---------- */
function setLang(l){
  document.body.dataset.lang = l;
  document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === l));
  store.set("c7lang", l);
}
document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));

/* ---------- TABS ---------- */
const TABS = [...CH.map(c => ({id:c.id, label:`Chapter ${c.n}`, sub:c.ml})), {id:"test", label:"Mixed Test", sub:"20 questions · മിശ്ര പരീക്ഷ"}];
function renderTabs(active){
  $("#tabs").innerHTML = TABS.map(t => `<a class="tab" role="tab" href="#${t.id}" aria-selected="${t.id === active}" data-id="${t.id}">${esc(t.label)}<small class="ml-small">${esc(t.sub)}</small></a>`).join("");
}

/* ---------- MCQ ---------- */
function mcqHTML(q, idx, key){
  const order = shuffle([0,1,2,3]);
  return `<li class="q" data-key="${key}" data-correct="${q[3]}">
    <span class="n">${idx}.</span>
    <div class="body">
      <div class="qtext">${bi(q[0], q[1])}</div>
      <div class="opts">${order.map(i => `<button type="button" class="opt" data-i="${i}">${bi(q[2][i][0], q[2][i][1])}</button>`).join("")}</div>
      <div class="fb" hidden></div>
    </div>
  </li>`;
}
function answerMCQ(li, btn, q, onDone){
  const correct = +li.dataset.correct, pick = +btn.dataset.i, ok = pick === correct;
  li.querySelectorAll(".opt").forEach(b => {
    b.disabled = true;
    const i = +b.dataset.i;
    if (i === correct) b.classList.add("correct");
    else if (i === pick) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  const fb = li.querySelector(".fb");
  const right = q[2][correct];
  fb.innerHTML = ok
    ? `<b class="ok">${bi("Correct!", "ശരിയാണ്!")}</b> ${q[4] ? bi(q[4], q[5]) : ""}`
    : `<b class="bad">${bi("Not quite.", "തെറ്റി.")}</b> ${bi("Answer: " + right[0], "ഉത്തരം: " + right[1])} ${q[4] ? bi(q[4], q[5]) : ""}`;
  fb.hidden = false;
  onDone && onDone(ok, pick);
}

    </section>
    <section style="display:flex;flex-direction:column;gap:14px">
      <div class="sec-title">
        <h3><span class="en">Answer these questions</span><span class="ml">ഉത്തരം എഴുതുക</span></h3>
        <span class="score">${bi("Think first, then check", "ആലോചിച്ചശേഷം നോക്കുക")}</span>
      </div>
      <div class="cards">${c.short.map((s, i) => `
        <div class="card">
          <div class="qtext">${bi(s.en, s.ml)}</div>
          <button type="button" class="reveal" aria-expanded="false" data-i="${i}">${bi("Show answer", " · ഉത്തരം കാണുക")}</button>
          <div class="ans" hidden>
            ${s.aen.length > 1 ? `<ol class="en">${s.aen.map(a => `<li>${esc(a)}</li>`).join("")}</ol>` : `<p class="en" style="margin:0">${esc(s.aen[0])}</p>`}
            ${s.aml.length > 1 ? `<ol class="ml">${s.aml.map(a => `<li>${esc(a)}</li>`).join("")}</ol>` : `<p class="ml" style="margin:8px 0 0">${esc(s.aml[0])}</p>`}
          </div>
        </div>`).join("")}
      </div>
    </section>`;

  const total = c.mcq.length;
  const upd = () => {
    const vals = Object.values(saved);
    const right = vals.filter(x => x.ok).length;
    $("#score").innerHTML = `<b>${right}</b> ${bi("correct", "ശരി")} · ${vals.length}/${total} ${bi("answered", "ചെയ്തു")}`;
  };
  v.querySelectorAll(".q").forEach(li => {
    const k = li.dataset.key, q = c.mcq[k];
    if (saved[k]) {
      const btn = li.querySelector(`.opt[data-i="${saved[k].pick}"]`);
      answerMCQ(li, btn, q);
    }
    li.querySelectorAll(".opt").forEach(btn => btn.addEventListener("click", () => {
      answerMCQ(li, btn, q, (ok, pick) => { saved[k] = {ok, pick}; store.set("c7-" + c.id, saved); upd(); });
    }));
  });
  $("#reset").addEventListener("click", () => { store.set("c7-" + c.id, {}); renderChapter(c); });
  v.querySelectorAll(".reveal").forEach(b => b.addEventListener("click", () => {
    const a = b.nextElementSibling, open = a.hidden;
    a.hidden = !open; b.setAttribute("aria-expanded", open);
    b.innerHTML = open ? bi("Hide answer", " · ഉത്തരം മറയ്ക്കുക") : bi("Show answer", " · ഉത്തരം കാണുക");
  }));
  upd();
}

/* ---------- TEST VIEW ---------- */
function renderTestIntro(){
  const best = store.get("c7-best", null);
  $("#view").innerHTML = `
    <div class="chap-head">
      <div class="num">${bi("Chapters 20–25", "പാഠം 20–25")}</div>
      <h2><span class="en">Mixed Revision Test</span><span class="ml">മിശ്ര പുനരവലോകന പരീക്ഷ</span></h2>
    </div>
    <div class="test-intro">
      <p>${bi("20 questions picked at random from all six chapters, one at a time. Your score is shown at the end, with every question you missed.", "ആറ് പാഠങ്ങളിൽ നിന്നും 20 ചോദ്യങ്ങൾ, ഓരോന്നായി. അവസാനം മാർക്കും തെറ്റിയ ചോദ്യങ്ങളും കാണാം.")}</p>
      ${best !== null ? `<p class="score">${bi("Your best score on this device:", "ഈ ഫോണിലെ മികച്ച മാർക്ക്:")} <b>${best}/20</b></p>` : ""}
      <div class="btnrow"><button type="button" class="btn" id="start">${bi("Start test", " · പരീക്ഷ തുടങ്ങുക")}</button></div>
    </div>`;
  $("#start").addEventListener("click", startTest);
}
function startTest(){
  const pool = [];
  CH.forEach(c => c.mcq.forEach(q => pool.push({q, ch:c.n})));
  const qs = shuffle(pool).slice(0, 20);
  let i = 0, score = 0; const missed = [];
  const step = () => {
    if (i >= qs.length) return finish();
    const {q, ch} = qs[i];
    $("#view").innerHTML = `
      <div style="display:flex;flex-direction:column;gap:8px">
        <div class="test-meta"><span>${bi("Question " + (i + 1) + " of 20", " · ചോദ്യം " + (i + 1) + "/20")}</span><span>${bi("Score " + score, " · മാർക്ക് " + score)}</span></div>
        <div class="bar"><i style="width:${i / qs.length * 100}%"></i></div>
      </div>
      <ol class="qlist"><li class="q" data-correct="${q[3]}"><span class="n"><span class="chip">${bi("Ch " + ch, " · പാഠം " + ch)}</span></span>
        <div class="body">
          <div class="qtext">${bi(q[0], q[1])}</div>
          <div class="opts">${shuffle([0,1,2,3]).map(k => `<button type="button" class="opt" data-i="${k}">${bi(q[2][k][0], q[2][k][1])}</button>`).join("")}</div>
          <div class="fb" hidden></div>
        </div></li></ol>
      <div class="btnrow"><button type="button" class="btn" id="next" hidden>${i === qs.length - 1 ? bi("See my score", " · മാർക്ക് കാണുക") : bi("Next question", " · അടുത്ത ചോദ്യം")}</button></div>`;
    const li = $("#view .q");
    li.querySelectorAll(".opt").forEach(btn => btn.addEventListener("click", () => {
      answerMCQ(li, btn, q, ok => { if (ok) score++; else missed.push({q, ch}); $("#next").hidden = false; $("#next").focus(); });
    }));
    $("#next").addEventListener("click", () => { i++; step(); window.scrollTo({top:0}); });
  };
  const finish = () => {
    const best = store.get("c7-best", 0);
    if (score > best) store.set("c7-best", score);
    const msg = score >= 18 ? ["Excellent! Well prepared.", "മികച്ചത്! നന്നായി പഠിച്ചിട്ടുണ്ട്."]
              : score >= 14 ? ["Good work. Revise the ones you missed.", "നല്ലത്. തെറ്റിയവ ഒന്നുകൂടി പഠിക്കുക."]
              : ["Keep practising. Go through each chapter again.", "ഓരോ പാഠവും ഒന്നുകൂടി വായിച്ച് പരിശീലിക്കുക."];
    $("#view").innerHTML = `
      <div class="result">
        <span class="chip">${bi("Your score", " · നിങ്ങളുടെ മാർക്ക്")}</span>
        <div class="big">${score}<small>/20</small></div>
        <p style="margin:0">${bi(msg[0], msg[1])}</p>
        <div class="btnrow" style="justify-content:center;margin-top:8px">
          <button type="button" class="btn" id="again">${bi("Try another test", " · വീണ്ടും എഴുതുക")}</button>
        </div>
      </div>
      ${missed.length ? `<section style="display:flex;flex-direction:column;gap:12px">
        <div class="sec-title"><h3><span class="en">Questions to revise</span><span class="ml">വീണ്ടും പഠിക്കേണ്ടവ</span></h3></div>
        <div class="cards">${missed.map(m => `<div class="card">
          <span class="chip" style="align-self:flex-start">${bi("Chapter " + m.ch, " · പാഠം " + m.ch)}</span>
          <div class="qtext">${bi(m.q[0], m.q[1])}</div>
          <div class="ans">${bi("Answer: " + m.q[2][m.q[3]][0], "ഉത്തരം: " + m.q[2][m.q[3]][1], "div")}</div>
        </div>`).join("")}</div></section>` : ""}`;
    $("#again").addEventListener("click", startTest);
  };
  step();
}

/* ---------- ROUTING ---------- */
function route(){
  const id = (location.hash || "#ch20").slice(1);
  const c = CH.find(x => x.id === id);
  renderTabs(c ? c.id : "test");
  if (c) renderChapter(c); else renderTestIntro();
}
document.addEventListener("click", e => {
  const t = e.target.closest(".tab");
  if (!t) return;
  e.preventDefault();
  try { history.replaceState(null, "", "#" + t.dataset.id); } catch(err) {}
  const c = CH.find(x => x.id === t.dataset.id);
  renderTabs(t.dataset.id);
  if (c) renderChapter(c); else renderTestIntro();
  window.scrollTo({top:0});
});
window.addEventListener("hashchange", route);
setLang(store.get("c7lang", "both"));
route();
</script>

</body>
</html>
